<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>

    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://googlevideo.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//googlevideo.com">
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        #status { display: none; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';

        let player = null;
        let apiReady = false;
        let pendingUnmute = false;
        let pendingId = null;
        let currentId = null;

        // Load YouTube IFrame API ngay lập tức
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin,
                    widget_referrer: window.location.origin,
                    // KHÔNG có mute: 1 ở đây
                    disablekb: 1,
                    iv_load_policy: 3,
                    fs: 0,
                    cc_load_policy: 0
                },
                events: {
                    'onReady': () => {
                        apiReady = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        }
                        // Load video chờ nếu có
                        if (pendingId) {
                            loadVideo(pendingId);
                            pendingId = null;
                        }
                    },
                    'onStateChange': (e) => {
                        // State 1 = PLAYING → unmute
                        if (e.data === YT.PlayerState.PLAYING && pendingUnmute) {
                            pendingUnmute = false;
                            try { 
                                player.unMute(); 
                            } catch (err) {
                                console.warn('Unmute failed:', err);
                            }
                        }
                    },
                    'onError': (e) => {
                        console.warn('YT error:', e.data);
                    }
                }
            });
        };

        function loadVideo(videoId) {
            if (!videoId || currentId === videoId) return;
            currentId = videoId;

            if (!player || !apiReady) {
                pendingId = videoId;
                return;
            }

            try {
                player.mute();  // Mute trước khi load (tránh bị block autoplay)
                player.loadVideoById(videoId);
                pendingUnmute = true;  // Đánh dấu cần unmute sau khi playing
            } catch (err) {
                console.warn('Load failed:', err);
            }
        }

        function stopVideo() {
            pendingUnmute = false;
            currentId = null;
            pendingId = null;
            if (player && apiReady) {
                try {
                    player.stopVideo();
                } catch (e) {}
            }
        }

        window.addEventListener('message', function(event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) loadVideo(data.videoId);
            if (data.type === 'stop') stopVideo();
            if (data.type === 'ping' && window.parent !== window) {
                window.parent.postMessage({ type: 'pong', status: 'ok' }, PARENT_ORIGIN);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (player) player.stopVideo();
        });

        // Service Worker để cache (tải nhanh từ lần 2)
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE = 'yt-relay-v2';
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => {
                    const url = new URL(e.request.url);
                    if (url.origin.endsWith('youtube.com') || url.origin.endsWith('ytimg.com') || url.origin.endsWith('googlevideo.com')) {
                        e.respondWith(
                            caches.open(CACHE).then(cache =>
                                cache.match(e.request).then(cached => {
                                    if (cached) {
                                        fetch(e.request).then(res => {
                                            if (res.ok) cache.put(e.request, res);
                                        }).catch(() => {});
                                        return cached;
                                    }
                                    return fetch(e.request).then(res => {
                                        if (res.ok && e.request.method === 'GET') {
                                            cache.put(e.request, res.clone());
                                        }
                                        return res;
                                    });
                                })
                            )
                        );
                    }
                });
            `;
            try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            } catch (e) {}
        }
    </script>
</body>
</html>
