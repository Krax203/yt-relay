<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>

    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://googlevideo.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//googlevideo.com">
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }

        /* === BUBBLE ADDON: BEGIN (CSS) === */
        #pvbar {
            position: absolute; left: 0; right: 0; bottom: 0; height: 44px; z-index: 10;
            display: flex; align-items: center; gap: 8px; padding: 0 10px;
            background: linear-gradient(transparent, rgba(0,0,0,.78));
            opacity: 0; transition: opacity .25s; pointer-events: auto;
        }
        #pvbar.pv-show { opacity: 1; }
        #pvbar .time {
            color: #fff; font: 11px/1.2 sans-serif; text-shadow: 0 1px 2px #000;
            white-space: nowrap; flex: 0 0 auto;
        }
        #pvtrack { position: relative; flex: 1 1 auto; height: 20px; cursor: pointer; }
        #pvtrack::before {
            content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 4px;
            background: rgba(255,255,255,.25); border-radius: 2px;
        }
        #pvfill {
            position: absolute; left: 0; top: 8px; height: 4px; width: 0;
            background: #f00; border-radius: 2px;
        }
        #pvbubble {
            position: absolute; bottom: 50px; left: 0;
            width: min(240px, 62%);
            aspect-ratio: 16 / 9;
            background: #000; border: 2px solid #fff; border-radius: 6px;
            overflow: hidden; opacity: 0; pointer-events: none;
            transition: opacity .12s; z-index: 11;
        }
        #pvbubble video { width: 100%; height: 100%; object-fit: cover; display: block; }
        #pvbtime {
            position: absolute; right: 4px; bottom: 2px; color: #fff;
            font: 11px/1.2 sans-serif; background: rgba(0,0,0,.7);
            padding: 2px 5px; border-radius: 3px;
        }
        /* === BUBBLE ADDON: END (CSS) === */
    </style>
</head>
<body>
    <div id="player"></div>

    <!-- === BUBBLE ADDON: BEGIN (DOM) === -->
    <div id="pvbar">
        <div id="pvtrack"><div id="pvfill"></div></div>
        <div id="pvtime" class="time">0:00 / 0:00</div>
    </div>
    <div id="pvbubble">
        <video id="pvbvid" muted playsinline preload="auto"></video>
        <div id="pvbtime">0:00</div>
    </div>
    <!-- === BUBBLE ADDON: END (DOM) === -->

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';

        let player = null;
        let apiReady = false;
        let pendingUnmute = false;
        let pendingId = null;
        let currentId = null;

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function fmt(s) {
            s = Math.max(0, Math.floor(s || 0));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 3600 % 60;
            return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
        }

        /* === QUALITY ADDON: BEGIN === */
        let qualitySetFor = null;
        const QUALITY_PRIORITY = ['highres', 'hd2880', 'hd2160', 'hd1440', 'hd1080', 'hd720', 'large', 'medium', 'small', 'tiny'];

        function setBestQuality() {
            if (!player || !apiReady) return;
            try {
                const levels = player.getAvailableQualityLevels() || [];
                if (!levels.length) return;
                const chosen = QUALITY_PRIORITY.find(q => levels.includes(q)) || levels[0];
                player.setPlaybackQuality(chosen);
            } catch (e) {}
        }
        /* === QUALITY ADDON: END === */

        /* === PERSISTENT CACHE BRIDGE: BEGIN === */
        const LS_KEY = 'pv_stream_cache_v1';
        function lsReadAll() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                const obj = raw ? JSON.parse(raw) : {};
                return (obj && typeof obj === 'object') ? obj : {};
            } catch (e) { return {}; }
        }
        function lsWriteAll(obj) {
            try {
                const entries = Object.entries(obj);
                let out = obj;
                if (entries.length > 300) {
                    entries.sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
                    out = Object.fromEntries(entries.slice(entries.length - 300));
                }
                localStorage.setItem(LS_KEY, JSON.stringify(out));
            } catch (e) {}
        }
        /* === PERSISTENT CACHE BRIDGE: END === */

        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin,
                    widget_referrer: window.location.origin,
                    disablekb: 1,
                    iv_load_policy: 3,
                    fs: 0,
                    cc_load_policy: 0
                },
                events: {
                    'onReady': () => {
                        apiReady = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        }
                        if (pendingId) { loadVideo(pendingId); pendingId = null; }
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            if (pendingUnmute) {
                                pendingUnmute = false;
                                try { player.unMute(); } catch (err) {}
                            }
                            if (qualitySetFor !== currentId) {
                                qualitySetFor = currentId;
                                setBestQuality();
                            }
                        }
                    },
                    'onError': (e) => { console.warn('YT error:', e.data); }
                }
            });
        };

        function loadVideo(videoId) {
            if (!videoId || currentId === videoId) return;
            currentId = videoId;
            qualitySetFor = null;
            if (!player || !apiReady) { pendingId = videoId; return; }
            try {
                player.mute();
                player.loadVideoById(videoId);
                pendingUnmute = true;
            } catch (err) { console.warn('Load failed:', err); }
        }

        function stopVideo() {
            pendingUnmute = false;
            currentId = null;
            pendingId = null;
            if (player && apiReady) { try { player.stopVideo(); } catch (e) {} }
        }

        /* === BUBBLE ADDON: BEGIN (LOGIC) === */
        const bar = document.getElementById('pvbar');
        const track = document.getElementById('pvtrack');
        const fill = document.getElementById('pvfill');
        const timeLab = document.getElementById('pvtime');
        const bubble = document.getElementById('pvbubble');
        const bvid = document.getElementById('pvbvid');
        const btime = document.getElementById('pvbtime');

        let streamUrl = null;
        let duration = 0;

        /* === BUBBLE TWEAK: BEGIN (DEBOUNCE) === */
        // Ngưỡng seek tối thiểu: chỉ queue seek mới khi |Δfrac| vượt ngưỡng này
        // Tránh mỗi mousemove đều sinh range request → giảm seek stall
        const SEEK_MIN_DELTA = 0.02;   // 0.5% tổng duration
        let lastQueuedFrac = -1;
        /* === BUBBLE TWEAK: END (DEBOUNCE) === */

        setInterval(() => {
            if (!player || !apiReady) return;
            try {
                duration = player.getDuration() || 0;
                const cur = player.getCurrentTime() || 0;
                if (duration > 0) {
                    fill.style.width = (cur / duration * 100) + '%';
                    timeLab.textContent = fmt(cur) + ' / ' + fmt(duration);
                }
            } catch (e) {}
        }, 500);

        let hideT = 0;
        bar.addEventListener('mouseenter', () => { clearTimeout(hideT); bar.classList.add('pv-show'); });
        bar.addEventListener('mouseleave', () => {
            hideT = setTimeout(() => bar.classList.remove('pv-show'), 900);
            hideBubble();
        });

        let dragging = false;
        let raf = 0, nextFrac = null;
        let braf = 0, bnext = null;

        function fracFrom(e) {
            const r = track.getBoundingClientRect();
            return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        }
        function seekPlayer(f) {
            if (apiReady && duration > 0) { try { player.seekTo(f * duration, true); } catch (e) {} }
        }
        function queueSeekPlayer(f) {
            nextFrac = f;
            if (raf) return;
            raf = requestAnimationFrame(() => { raf = 0; if (nextFrac !== null) seekPlayer(nextFrac); });
        }
        function queueBubbleSeek(f) {
            /* === BUBBLE TWEAK: BEGIN (DEBOUNCE GATE) === */
            if (lastQueuedFrac >= 0 && Math.abs(f - lastQueuedFrac) < SEEK_MIN_DELTA) return;
            lastQueuedFrac = f;
            /* === BUBBLE TWEAK: END (DEBOUNCE GATE) === */

            bnext = f;
            if (braf) return;
            braf = requestAnimationFrame(() => {
                braf = 0;
                if (bnext === null || !duration) return;
                try { bvid.currentTime = bnext * duration; } catch (e) {}
            });
        }
        function moveBubble(e, f) {
            bubble.style.opacity = '1';
            const bw = bubble.offsetWidth || 240;
            const x = Math.min(window.innerWidth - bw - 4, Math.max(4, e.clientX - bw / 2));
            bubble.style.left = x + 'px';
            btime.textContent = fmt(f * (duration || 0));
            if (streamUrl && bvid.getAttribute('src') !== streamUrl) bvid.src = streamUrl;
            if (streamUrl) queueBubbleSeek(f);
        }
        function hideBubble() {
            bubble.style.opacity = '0';
            lastQueuedFrac = -1;   // BUBBLE TWEAK: reset khi rời track
        }

        track.addEventListener('pointermove', (e) => {
            const f = fracFrom(e);
            moveBubble(e, f);
            if (dragging) queueSeekPlayer(f);
        });
        track.addEventListener('pointerleave', () => { if (!dragging) hideBubble(); });
        track.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            dragging = true;
            lastQueuedFrac = -1;   // BUBBLE TWEAK: reset khi bắt đầu kéo mới
            try { track.setPointerCapture(e.pointerId); } catch (err) {}
            const f = fracFrom(e);
            seekPlayer(f);
            moveBubble(e, f);
        });
        track.addEventListener('pointerup', () => { dragging = false; });

        bvid.addEventListener('error', () => { bvid.removeAttribute('src'); });
        /* === BUBBLE ADDON: END (LOGIC) === */

        window.addEventListener('message', function (event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) {
                streamUrl = null;
                bvid.removeAttribute('src');
                try { bvid.load(); } catch (e) {}
                lastQueuedFrac = -1;   // BUBBLE TWEAK: reset cho video mới
                hideBubble();
                loadVideo(data.videoId);
            }
            if (data.type === 'stream' && data.url) {
                streamUrl = data.url;
                if (bvid.getAttribute('src') !== streamUrl) bvid.src = streamUrl;

                /* === BUBBLE TWEAK: BEGIN (AGGRESSIVE PRELOAD) === */
                // Force fetch segment đầu: play → chờ 100ms để browser kéo segment → pause.
                // Giữ kết nối HTTP warm + buffer sẵn sàng → seek đầu tiên không stall.
                // Trade-off: tốn ~200-500 KB mỗi preview, nhưng là media traffic bình thường.
                bvid.muted = true;
                const p = bvid.play();
                if (p && typeof p.then === 'function') {
                    p.then(() => {
                        setTimeout(() => {
                            try { bvid.pause(); } catch (e) {}
                        }, 400);
                    }).catch(() => { /* autoplay bị chặn: giữ src, không crash */ });
                }
                /* === BUBBLE TWEAK: END (AGGRESSIVE PRELOAD) === */
            }
            if (data.type === 'stop') {
                stopVideo();
                streamUrl = null;
                bvid.removeAttribute('src');
                try { bvid.load(); } catch (e) {}
                lastQueuedFrac = -1;   // BUBBLE TWEAK: reset
                hideBubble();
                bar.classList.remove('pv-show');
            }

            /* === PERSISTENT CACHE BRIDGE: BEGIN (HANDLERS) === */
            if (data.type === 'cache-get' && data.id) {
                const e = lsReadAll()[data.id];
                if (e && e.url) {
                    window.parent.postMessage({ type: 'cache-hit', id: data.id, url: e.url, ts: e.ts || 0 }, PARENT_ORIGIN);
                } else {
                    window.parent.postMessage({ type: 'cache-miss', id: data.id }, PARENT_ORIGIN);
                }
            }
            if (data.type === 'cache-set' && data.id && data.url) {
                const all = lsReadAll();
                all[data.id] = { url: data.url, ts: data.ts || Date.now() };
                lsWriteAll(all);
            }
            /* === PERSISTENT CACHE BRIDGE: END (HANDLERS) === */

            if (data.type === 'ping' && window.parent !== window) {
                window.parent.postMessage({ type: 'pong', status: 'ok' }, PARENT_ORIGIN);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (player) player.stopVideo();
        });
    </script>
</body>
</html>
