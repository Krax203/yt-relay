<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Relay</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%;}
  #player{width:100%;height:100%;}
  #status{position:fixed;top:8px;left:8px;color:#aaa;font:12px/1.4 monospace;
          z-index:9;pointer-events:none;white-space:pre-wrap;}
</style>
</head>
<body>
<div id="player"></div>
<div id="status"></div>
<script>
(function(){
  'use strict';

  // Origin trang cha: suy ra từ referrer khi nằm trong iframe;
  // fallback về youtube.com khi không suy ra được.
  var PARENT_ORIGIN = 'https://www.youtube.com';
  try { if (document.referrer) PARENT_ORIGIN = new URL(document.referrer).origin; } catch(e){}

  var directVideoId = new URLSearchParams(location.search).get('v'); // chế độ test trực tiếp
  var currentId = directVideoId || null;
  var player = null, apiReady = false;
  var statusEl = document.getElementById('status');
  function setStatus(t){ statusEl.textContent = t || ''; }

  function notifyParent(msg){
    if (window.parent === window) return;          // mở trực tiếp: bỏ qua, không ném lỗi
    try { window.parent.postMessage(msg, PARENT_ORIGIN); } catch(e){}
  }

  // Thử bật tiếng + volume tối đa; nếu trình duyệt chặn thì giữ mute (player không chết)
  function tryUnmuteMax(){
    if (!player || !apiReady) return;
    try { player.unMute(); player.setVolume(100); } catch(e){}
  }

  function baseVars(extra){
    var v = {
      autoplay: 1,
      mute: 1,            // BẮT BUỘC lúc khởi tạo để autoplay không bị chặn cứng
      controls: 1, rel: 0, modestbranding: 1,
      iv_load_policy: 3, cc_load_policy: 0,
      playsinline: 1, enablejsapi: 1, fs: 1
    };
    if (extra) for (var k in extra) v[k] = extra[k];
    return v;
  }

  function events(){
    return {
      onReady: function(){
        apiReady = true;
        setStatus('');
        notifyParent({ type: 'relay-ready' });
        if (currentId) { tryUnmuteMax(); try { player.playVideo(); } catch(e){} }
      },
      onStateChange: function(ev){
        if (window.YT && ev.data === YT.PlayerState.PLAYING) tryUnmuteMax();
      },
      onError: function(ev){
        setStatus('Lỗi player: ' + ev.data);
        notifyParent({ type: 'relay-error', code: ev.data });
      }
    };
  }

  window.onYouTubeIframeAPIReady = function(){
    if (directVideoId) {
      // CHẾ ĐỘ 1: test trực tiếp ?v=... → truyền videoId vào constructor (đúng kiểu tác giả)
      player = new YT.Player('player', {
        width:'100%', height:'100%',
        videoId: directVideoId,
        playerVars: baseVars({ loop: 1, playlist: directVideoId }),
        events: events()
      });
    } else {
      // CHẾ ĐỘ 2: userscript nhúng → player rỗng, chờ lệnh postMessage, không đổi src nữa
      player = new YT.Player('player', {
        width:'100%', height:'100%',
        playerVars: baseVars(),
        events: events()
      });
      setStatus('relay: chờ lệnh');
    }
  };

  window.addEventListener('message', function(e){
    if (e.origin !== PARENT_ORIGIN) return;   // chỉ nhận lệnh từ trang cha hợp lệ
    var d = e.data || {};
    if (!apiReady || !player) return;

    if (d.type === 'load' && d.videoId) {
      currentId = d.videoId;
      try {
        player.mute();                    // mute trước để autoplay không bị chặn
        player.loadVideoById(d.videoId);  // đổi video KHÔNG tải lại trang
        tryUnmuteMax();                   // rồi thử bật tiếng tối đa ngay
      } catch(err){ setStatus('load lỗi: ' + err); }
    } else if (d.type === 'stop') {
      currentId = null;
      try { player.stopVideo(); } catch(e2){}
    } else if (d.type === 'ping') {
      try { e.source.postMessage({ type:'pong', ready: apiReady }, e.origin); } catch(e3){}
    }
  });

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
