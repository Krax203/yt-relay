<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>
    
    <!-- TỐI ƯU MẠNG: Preconnect để giảm độ trễ TLS/DNS khi gọi API và tải video -->
    <link rel="preconnect" href="https://www.youtube.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//i.ytimg.com">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        .status {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-family: Arial, sans-serif; text-align: center; display: none;
            pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <div id="status" class="status"></div>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';
        let player = null;
        let apiReady = false;
        let currentVideoId = null;
        let isMutedState = true;

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag); // Append vào head chuẩn hơn

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        };

        function onPlayerReady() {
            apiReady = true;
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'relay-ready' }, PARENT_ORIGIN);
            }
        }

        function onPlayerStateChange(event) {
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'player-state-change',
                    state: event.data,
                    videoId: currentVideoId
                }, PARENT_ORIGIN);
            }
        }

        function onPlayerError(event) {
            console.error('[YT Relay] Error:', event.data);
            const statusEl = document.getElementById('status');
            statusEl.innerText = 'Lỗi: ' + event.data;
            statusEl.style.display = 'block';
        }

        function loadVideo(videoId, shouldUnmute = true) {
            if (!player || !apiReady) return;

            // TỐI ƯU LUỒNG: Chặn gọi lại API nếu đang phát chính video này
            if (currentVideoId === videoId && player.getPlayerState() === YT.PlayerState.PLAYING) {
                return; 
            }

            currentVideoId = videoId;
            document.getElementById('status').style.display = 'none';

            // Mute trước để lách Autoplay Policy của trình duyệt
            player.mute();
            isMutedState = true;
            
            // Load và phát video
            player.loadVideoById(videoId);

            // Cố gắng unmute để có âm thanh maximum
            if (shouldUnmute) {
                // Đợi 1 nhịp tick để trình duyệt kịp nhận diện media đang phát
                setTimeout(() => {
                    player.unMute();
                    player.setVolume(100);
                    isMutedState = false;
                }, 50);
            }
        }

        function stopVideo() {
            if (player && apiReady) {
                // stopVideo giải phóng băng thông mạng tốt hơn pauseVideo
                player.stopVideo(); 
                currentVideoId = null;
            }
        }

        // Lắng nghe postMessage
        window.addEventListener('message', function(event) {
            if (PARENT_ORIGIN !== '*' && event.origin !== PARENT_ORIGIN) return;

            const data = event.data;
            if (!data || !data.type) return;

            switch(data.type) {
                case 'load':
                    if (data.videoId) {
                        loadVideo(data.videoId, data.unmute !== false);
                    }
                    break;
                case 'stop':
                    stopVideo();
                    break;
                case 'ping':
                    event.source.postMessage({ type: 'pong', ready: apiReady }, event.origin);
                    break;
            }
        });

        window.addEventListener('beforeunload', () => {
            if (player) player.stopVideo();
        });
    </script>
</body>
</html>
