<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>

    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://googlevideo.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//googlevideo.com">
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }

        #pvstage {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain; display: none; background: #000; z-index: 1;
        }
        #pvstage.pv-fb { display: block; }

        /* === SHORTS PROGRESS BAR === */
        #shorts-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 100;
            display: none;
        }
        #shorts-progress.pv-active {
            display: block;
        }
        #shorts-progress-fill {
            height: 100%;
            background: #ff0000;
            width: 0%;
            transition: width 0.1s linear;
        }
        #shorts-progress:hover {
            height: 6px;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <video id="pvstage" muted playsinline preload="auto" controls></video>
    
    <!-- Shorts Progress Bar -->
    <div id="shorts-progress">
        <div id="shorts-progress-fill"></div>
    </div>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';

        let player = null;
        let apiReady = false;
        let pendingUnmute = false;
        let pendingId = null;
        let currentId = null;
        let isShort = false;
        let progressTimer = null;

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        const progressBar = document.getElementById('shorts-progress');
        const progressFill = document.getElementById('shorts-progress-fill');

        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin,
                    widget_referrer: window.location.origin,
                    disablekb: 1,
                    iv_load_policy: 3,
                    fs: 0,
                    cc_load_policy: 0
                },
                events: {
                    'onReady': () => {
                        apiReady = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        }
                        if (pendingId) { loadVideo(pendingId); pendingId = null; }
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            if (pendingUnmute) {
                                pendingUnmute = false;
                                try { player.unMute(); } catch (err) {}
                            }
                            if (isShort) {
                                startProgressUpdate();
                            }
                        } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
                            stopProgressUpdate();
                        }
                    },
                    'onError': (e) => {
                        console.warn('YT error:', e.data);
                        if (e.data === 100 || e.data === 101 || e.data === 150) {
                            ytErrored = true;
                            if (window.parent !== window) {
                                window.parent.postMessage({ type: 'yt-error', code: e.data }, PARENT_ORIGIN);
                            }
                        }
                    }
                }
            });
        };

        function startProgressUpdate() {
            stopProgressUpdate();
            progressTimer = setInterval(() => {
                try {
                    const currentTime = player.getCurrentTime() || 0;
                    const duration = player.getDuration() || 0;
                    if (duration > 0) {
                        const percent = (currentTime / duration) * 100;
                        progressFill.style.width = percent + '%';
                    }
                } catch (e) {}
            }, 100);
        }

        function stopProgressUpdate() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        progressBar.addEventListener('click', (e) => {
            if (!player || !apiReady) return;
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            try {
                const duration = player.getDuration();
                if (duration > 0) {
                    player.seekTo(duration * percent, true);
                }
            } catch (e) {}
        });

        function loadVideo(videoId) {
            if (!videoId || currentId === videoId) return;
            currentId = videoId;
            if (!player || !apiReady) { pendingId = videoId; return; }
            try {
                player.mute();
                player.loadVideoById(videoId);
                pendingUnmute = true;
                
                if (isShort) {
                    progressBar.classList.add('pv-active');
                } else {
                    progressBar.classList.remove('pv-active');
                    stopProgressUpdate();
                }
            } catch (err) { console.warn('Load failed', err); }
        }

        function stopVideo() {
            pendingUnmute = false;
            currentId = null;
            pendingId = null;
            isShort = false;
            resetFallback();
            stopProgressUpdate();
            progressBar.classList.remove('pv-active');
            progressFill.style.width = '0%';
            if (player && apiReady) { try { player.stopVideo(); } catch (e) {} }
        }

        const playerEl = document.getElementById('player');
        const stageVid = document.getElementById('pvstage');
        let fallbackMode = false;
        let ytErrored = false;
        let streamUrl = null;

        stageVid.addEventListener('playing', () => {
            try { stageVid.muted = false; } catch (e) {}
        });
        stageVid.addEventListener('error', () => {
            console.warn('Fallback stage video error');
            stageVid.classList.remove('pv-fb');
            playerEl.style.display = '';
            fallbackMode = false;
        });

        function activateFallback() {
            if (fallbackMode || !streamUrl) return;
            fallbackMode = true;
            try { if (player && apiReady) player.stopVideo(); } catch (e) {}
            playerEl.style.display = 'none';
            stageVid.classList.add('pv-fb');
            if (stageVid.getAttribute('src') !== streamUrl) stageVid.src = streamUrl;
            stageVid.muted = true;
            const p = stageVid.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
        }

        function resetFallback() {
            fallbackMode = false;
            ytErrored = false;
            stageVid.classList.remove('pv-fb');
            stageVid.removeAttribute('src');
            try { stageVid.load(); } catch (e) {}
            playerEl.style.display = '';
        }

        window.addEventListener('message', function (event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) {
                streamUrl = null;
                isShort = !!data.isShort;
                resetFallback();
                loadVideo(data.videoId);
            }
            if (data.type === 'stream' && data.url) {
                streamUrl = data.url;
                if (ytErrored && !fallbackMode) activateFallback();
            }
            if (data.type === 'stop') {
                stopVideo();
                streamUrl = null;
            }
        });

        window.addEventListener('beforeunload', () => {
            if (player) player.stopVideo();
            stopProgressUpdate();
        });
    </script>
</body>
</html>
