<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="youtube-player"></div>

    <script>
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        
        let player = null;

        function onYouTubeIframeAPIReady() {
            if (!videoId) return;
            
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                width: '100%',
                height: '100%',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 1,              // Показываем контролы (шестерёнка, прогрессбар, пауза)
                    'rel': 0,                   // Без похожих видео в конце
                    'modestbranding': 1,        // Минимальный логотип
                    'iv_load_policy': 3,        // Без аннотаций
                    'fs': 1,                    // Включаем кнопку fullscreen
                    'disablekb': 0,             // Разрешаем управление клавиатурой
                    'playsinline': 1,
                    'cc_load_policy': 0,        // Без субтитров по умолчанию
                    'loop': 1,
                    'playlist': videoId
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            try {
                event.target.setVolume(5);
                event.target.unMute();
                event.target.playVideo();
            } catch (e) {
                event.target.mute();
                event.target.playVideo();
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (player.isMuted && player.isMuted()) {
                    try {
                        player.setVolume(5);
                        player.unMute();
                    } catch (e) {}
                }
            }
        }
    </script>
</body>
</html>
