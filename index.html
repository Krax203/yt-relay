<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>
    
    <!-- OPTIMIZATION 1: Preconnect & DNS-prefetch 
         Ép trình duyệt bắt tay sẵn với server YouTube và CDN googlevideo.com 
         Giúp tiết kiệm ~200ms-400ms thời gian mạng mỗi lần gọi chunk video -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com">
    <link rel="dns-prefetch" href="https://googlevideo.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #player {
            width: 100%;
            height: 100%;
        }
        .status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <div id="status" class="status">
        <p>Đang chờ lệnh...</p>
    </div>

    <script>
        // CẤU HÌNH BẢO MẬT
        const PARENT_ORIGIN = 'https://www.youtube.com'; 

        let player = null;
        let apiReady = false;
        let currentVideoId = null;

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 0,
                    controls: 1, // Đổi thành 0 nếu bạn muốn ẩn thanh điều khiển cho gọn
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        };

        function onPlayerReady(event) {
            apiReady = true;
            console.log('[YT Relay] Player ready');
            
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'relay-ready',
                    status: 'ready'
                }, PARENT_ORIGIN);
            }

            // Giữ nguyên tính năng test qua URL ?v=VIDEO_ID
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');
            if (videoId) {
                console.log('[YT Relay] Auto-loading video:', videoId);
                loadVideo(videoId);
            } else {
                document.getElementById('status').style.display = 'block';
                document.getElementById('status').innerHTML = 
                    '<p>✅ Relay đã sẵn sàng</p>' +
                    '<p style="font-size: 12px; margin-top: 10px; color: #888;">' +
                    'Trang này chỉ hoạt động khi được gọi từ userscript<br>' +
                    'Hoặc truy cập: ?v=VIDEO_ID để test</p>';
            }
        }

        function onPlayerStateChange(event) {
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'player-state-change',
                    state: event.data,
                    videoId: currentVideoId
                }, PARENT_ORIGIN);
            }
        }

        function onPlayerError(event) {
            console.error('[YT Relay] Player error:', event.data);
            let errorMsg = 'Lỗi player: ' + event.data;
            if (event.data === 100 || event.data === 105 || event.data === 150) {
                errorMsg = 'Video không thể phát trong embedded player (lỗi ' + event.data + ')';
            }
            document.getElementById('status').innerHTML = '<p style="color: #ff6b6b;">' + errorMsg + '</p>';
            document.getElementById('status').style.display = 'block';
        }

        function loadVideo(videoId) {
            if (!player || !apiReady) {
                console.error('[YT Relay] Player not ready');
                return;
            }

            currentVideoId = videoId;
            console.log('[YT Relay] Loading video with Fast Start:', videoId);
            
            try {
                // 1. Mute trước để vượt qua Autoplay Policy của trình duyệt
                player.mute();
                
                // 2. FAST START: Ép tải chunk đầu tiên ở chất lượng 360p (medium)
                // Chunk 360p rất nhẹ (~300KB) giúp video có hình gần như tức thì
                player.loadVideoById({
                    videoId: videoId,
                    startSeconds: 0,
                    suggestedQuality: 'medium' 
                });
                
                document.getElementById('status').style.display = 'none';

                // 3. Sửa lỗi TypeError: Bọc unMute trong try/catch vì nó không trả về Promise
                setTimeout(() => {
                    try {
                        player.unMute();
                    } catch (err) {
                        console.log('[YT Relay] Unmute blocked by browser policy, keeping muted.');
                    }
                }, 1000);

                // 4. PROGRESSIVE ENHANCEMENT: Nâng cấp chất lượng lên Auto (HD) sau 2 giây
                // Lúc này video đã phát mượt mà, ta yêu cầu YouTube tải các chunk tiếp theo ở chất lượng cao nhất
                setTimeout(() => {
                    try {
                        player.setPlaybackQuality('auto'); 
                    } catch (e) {
                        // Bỏ qua nếu trình phát không hỗ trợ hàm này
                    }
                }, 2000);

            } catch (err) {
                console.error('[YT Relay] Error loading video:', err);
            }
        }

        function stopVideo() {
            if (player) {
                player.stopVideo();
                document.getElementById('status').style.display = 'block';
                document.getElementById('status').innerHTML = '<p>⏸️ Đã dừng</p>';
            }
        }

        // Lắng nghe postMessage từ parent (Userscript)
        window.addEventListener('message', function(event) {
            if (PARENT_ORIGIN !== '*' && event.origin !== PARENT_ORIGIN) {
                console.warn('[YT Relay] Rejected message from:', event.origin);
                return;
            }

            const data = event.data;
            console.log('[YT Relay] Received message:', data);

            if (!data || !data.type) return;

            switch(data.type) {
                case 'load':
                    if (data.videoId) loadVideo(data.videoId);
                    break;
                case 'stop':
                    stopVideo();
                    break;
                case 'ping':
                    event.source.postMessage({
                        type: 'pong',
                        status: apiReady ? 'ready' : 'loading'
                    }, event.origin);
                    break;
            }
        });

        window.addEventListener('beforeunload', function() {
            if (player) player.stopVideo();
        });
    </script>
</body>
</html>
