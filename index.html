<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>

    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://googlevideo.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//googlevideo.com">
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }

        /* === FALLBACK ADDON: BEGIN (CSS) === */
        #pvstage {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain; display: none; background: #000; z-index: 1;
        }
        #pvstage.pv-fb { display: block; }
        /* === FALLBACK ADDON: END (CSS) === */

        /* === BUBBLE ADDON: BEGIN (CSS) === */
        #pvbar {
            position: absolute; left: 0; right: 0; bottom: 0; height: 44px; z-index: 10;
            display: flex; align-items: center; gap: 8px; padding: 0 10px;
            background: linear-gradient(transparent, rgba(0,0,0,.78));
            opacity: 0; transition: opacity .25s; pointer-events: auto;
        }
        #pvbar.pv-show { opacity: 1; }
        #pvbar .time {
            color: #fff; font: 11px/1.2 sans-serif; text-shadow: 0 1px 2px #000;
            white-space: nowrap; flex: 0 0 auto;
        }
        #pvtrack { position: relative; flex: 1 1 auto; height: 20px; cursor: pointer; }
        #pvtrack::before {
            content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 4px;
            background: rgba(255,255,255,.25); border-radius: 2px;
        }
        #pvfill {
            position: absolute; left: 0; top: 8px; height: 4px; width: 0;
            background: #f00; border-radius: 2px;
        }
        #pvbubble {
            position: absolute; bottom: 50px; left: 0;
            width: min(240px, 62%);
            aspect-ratio: 16 / 9;
            background: #000; border: 2px solid #fff; border-radius: 6px;
            overflow: hidden; opacity: 0; pointer-events: none;
            transition: opacity .12s; z-index: 11;
        }
        /* === BUBBLE STORYBOARD ADDON: BEGIN (IMG + VIDEO SWAP CSS) === */
        #pvbubble img {
            display: block; position: absolute; top: 0; left: 0; z-index: 1;
            pointer-events: none; transition: opacity .15s ease-out;
            opacity: 1;
        }
        #pvbubble video {
            width: 100%; height: 100%; object-fit: cover; display: block;
            position: absolute; top: 0; left: 0; z-index: 2;
            pointer-events: none; transition: opacity .15s ease-out;
            opacity: 0;
        }
        #pvbubble.pv-live img { opacity: 0; }
        #pvbubble.pv-live video { opacity: 1; }
        /* === BUBBLE STORYBOARD ADDON: END (IMG + VIDEO SWAP CSS) === */
        #pvbtime {
            position: absolute; right: 4px; bottom: 2px; color: #fff;
            font: 11px/1.2 sans-serif; background: rgba(0,0,0,.7);
            padding: 2px 5px; border-radius: 3px; z-index: 10;
        }
        /* === BUBBLE ADDON: END (CSS) === */
    </style>
</head>
<body>
    <div id="player"></div>

    <!-- === FALLBACK ADDON: BEGIN (DOM) === -->
    <video id="pvstage" muted playsinline preload="auto"></video>
    <!-- === FALLBACK ADDON: END (DOM) === -->

    <!-- === BUBBLE ADDON: BEGIN (DOM) === -->
    <div id="pvbar">
        <div id="pvtrack"><div id="pvfill"></div></div>
        <div id="pvtime" class="time">0:00 / 0:00</div>
    </div>
    <div id="pvbubble">
        <!-- === BUBBLE STORYBOARD ADDON: BEGIN (IMG) === -->
        <img id="pvbimg" alt="">
        <!-- === BUBBLE STORYBOARD ADDON: END (IMG) === -->
        <video id="pvbvid" muted playsinline preload="auto"></video>
        <div id="pvbtime">0:00</div>
    </div>
    <!-- === BUBBLE ADDON: END (DOM) === -->

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';

        let player = null;
        let apiReady = false;
        let pendingUnmute = false;
        let pendingId = null;
        let currentId = null;

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function fmt(s) {
            s = Math.max(0, Math.floor(s || 0));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 3600 % 60;
            return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
        }

        /* === PERSISTENT CACHE BRIDGE: BEGIN === */
        const LS_KEY = 'pv_stream_cache_v1';
        let lsObj = null;
        let persistTimer = 0;
        
        function lsLoad() {
            if (lsObj) return lsObj;
            try {
                const raw = localStorage.getItem(LS_KEY);
                const obj = raw ? JSON.parse(raw) : {};
                lsObj = (obj && typeof obj === 'object') ? obj : {};
            } catch (e) { lsObj = {}; }
            return lsObj;
        }
        function lsPersist() {
            if (persistTimer) return;
            persistTimer = setTimeout(() => {
                persistTimer = 0;
                try {
                    const now = Date.now() / 1000;
                    const validEntries = Object.entries(lsObj).filter(([_, e]) => {
                        if (!e.url) return false;
                        const exp = (() => {
                            try { return Number(new URL(e.url).searchParams.get('expire')) || 0; } 
                            catch (err) { return 0; }
                        })();
                        if (exp && now > exp - 60) return false;
                        return true;
                    });
                    let out = Object.fromEntries(validEntries);
                    if (validEntries.length > 300) {
                        validEntries.sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
                        out = Object.fromEntries(validEntries.slice(validEntries.length - 300));
                    }
                    lsObj = out;
                    localStorage.setItem(LS_KEY, JSON.stringify(out));
                } catch (e) {}
            }, 1000);
        }
        /* === PERSISTENT CACHE BRIDGE: END === */

        /* === PROGRESS LOOP: BEGIN === */
        let progTimer = 0;
        let progRunning = false;
        function updateProgress() {
            progTimer = 0;
            if (!player || !apiReady) { progRunning = false; return; }

            /* === FALLBACK ADDON: BEGIN (PROGRESS) === */
            if (fallbackMode) {
                const d = stageVid.duration || 0;
                duration = d;
                if (barVisible() && d > 0) {
                    const cur = stageVid.currentTime || 0;
                    fill.style.width = (cur / d * 100) + '%';
                    timeLab.textContent = fmt(cur) + ' / ' + fmt(d);
                }
                if (!stageVid.paused && !stageVid.ended) {
                    progTimer = setTimeout(updateProgress, barVisible() ? 100 : 500);
                } else {
                    progRunning = false;
                }
                return;
            }
            /* === FALLBACK ADDON: END (PROGRESS) === */

            let playing = false;
            try { playing = player.getPlayerState() === YT.PlayerState.PLAYING; } catch (e) {}
            if (!playing) { progRunning = false; return; }
            try {
                duration = player.getDuration() || 0;
                if (barVisible()) {
                    const cur = player.getCurrentTime() || 0;
                    if (duration > 0) {
                        fill.style.width = (cur / duration * 100) + '%';
                        timeLab.textContent = fmt(cur) + ' / ' + fmt(duration);
                    }
                }
            } catch (e) {}
            progTimer = setTimeout(updateProgress, barVisible() ? 100 : 500);
        }
        function ensureProgressLoop() {
            if (progRunning) return;
            progRunning = true;
            if (!progTimer) progTimer = setTimeout(updateProgress, 100);
        }
        function stopProgressLoop() {
            if (progTimer) { clearTimeout(progTimer); progTimer = 0; }
            progRunning = false;
        }
        /* === PROGRESS LOOP: END === */

        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin,
                    widget_referrer: window.location.origin,
                    disablekb: 1,
                    iv_load_policy: 3,
                    fs: 0,
                    cc_load_policy: 0
                },
                events: {
                    'onReady': () => {
                        apiReady = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        }
                        if (pendingId) { loadVideo(pendingId); pendingId = null; }
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            ensureProgressLoop();
                            if (pendingUnmute) {
                                pendingUnmute = false;
                                try { player.unMute(); } catch (err) {}
                            }
                        }
                    },
                    'onError': (e) => {
                        console.warn('YT error:', e.data);
                        /* === FALLBACK ADDON: BEGIN (TRIGGER) === */
                        if (e.data === 100 || e.data === 101 || e.data === 150) {
                            requestFallback();
                        }
                        /* === FALLBACK ADDON: END (TRIGGER) === */
                    }
                }
            });
        };

        function loadVideo(videoId) {
            if (!videoId || currentId === videoId) return;
            currentId = videoId;
            if (!player || !apiReady) { pendingId = videoId; return; }
            try {
                player.mute();
                player.loadVideoById(videoId);
                pendingUnmute = true;
            } catch (err) { console.warn('Load failed', err); }
        }

        function stopVideo() {
            pendingUnmute = false;
            currentId = null;
            pendingId = null;
            stopProgressLoop();
            resetFallback();
            if (player && apiReady) { try { player.stopVideo(); } catch (e) {} }
        }

        /* === FALLBACK ADDON: BEGIN (LOGIC) === */
        const playerEl = document.getElementById('player');
        const stageVid = document.getElementById('pvstage');
        let fallbackMode = false;
        let fallbackPending = false;

        stageVid.addEventListener('playing', () => {
            try { stageVid.muted = false; } catch (e) {}
        });
        stageVid.addEventListener('error', () => {
            console.warn('Fallback stage video error');
            stageVid.classList.remove('pv-fb');
            playerEl.style.display = '';
            fallbackMode = false;
        });

        function requestFallback() {
            if (fallbackMode) return;
            if (streamUrl) activateFallback();
            else fallbackPending = true;
        }

        function activateFallback() {
            if (fallbackMode || !streamUrl) return;
            fallbackMode = true;
            fallbackPending = false;
            try { if (player && apiReady) player.stopVideo(); } catch (e) {}
            stopProgressLoop();
            playerEl.style.display = 'none';
            stageVid.classList.add('pv-fb');
            if (stageVid.getAttribute('src') !== streamUrl) stageVid.src = streamUrl;
            stageVid.muted = true;
            const p = stageVid.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
            ensureProgressLoop();
        }

        function resetFallback() {
            fallbackMode = false;
            fallbackPending = false;
            stageVid.classList.remove('pv-fb');
            stageVid.removeAttribute('src');
            try { stageVid.load(); } catch (e) {}
            playerEl.style.display = '';
        }
        /* === FALLBACK ADDON: END (LOGIC) === */

        /* === BUBBLE ADDON: BEGIN (LOGIC) === */
        const bar = document.getElementById('pvbar');
        const track = document.getElementById('pvtrack');
        const fill = document.getElementById('pvfill');
        const timeLab = document.getElementById('pvtime');
        const bubble = document.getElementById('pvbubble');
        const bimg = document.getElementById('pvbimg');
        const bvid = document.getElementById('pvbvid');
        const btime = document.getElementById('pvbtime');

        function barVisible() { return bar.classList.contains('pv-show'); }

        let streamUrl = null;
        let videoSrcAttached = false;
        let duration = 0;

        // FIX 3: global sprite cache với LRU
        const SHEET_CACHE_MAX = 50;
        const globalSheetCache = new Map();
        
        function sheetCacheTrim() {
            if (globalSheetCache.size <= SHEET_CACHE_MAX) return;
            // Xóa sheet cũ nhất (đầu tiên trong Map insertion order)
            const oldestKey = globalSheetCache.keys().next().value;
            if (oldestKey !== undefined) {
                const oldImg = globalSheetCache.get(oldestKey);
                if (oldImg) { oldImg.src = ''; }
                globalSheetCache.delete(oldestKey);
            }
        }

        /* === BUBBLE STORYBOARD ADDON: BEGIN (STATE) === */
        let sbParsed = null;
        let sbRenderer = null;
        let lastFrac = -1;
        let liveArmed = false;
        let liveMode = false;
        let pendingSeeked = null;
        let metaListener = null;
        let seekTimer = 0;
        const STILL_DEBOUNCE = 120;

        function parseStoryboardSpec(spec) {
            if (!spec || typeof spec !== 'string') return null;
            const parts = spec.split('|');
            const template = parts[0];
            let globalSigh = '';
            const last = parts[parts.length - 1];
            if (!last.includes('#')) globalSigh = last;
            const levels = [];
            for (let i = 1; i < parts.length; i++) {
                const fields = parts[i].split('#');
                const nums = [];
                let j = 0;
                while (j < fields.length && /^\d+$/.test(fields[j])) { nums.push(Number(fields[j])); j++; }
                if (nums.length < 6) continue;
                let sigh = '';
                if (fields[j] === 'M$M') sigh = fields[j + 1] || '';
                levels.push({
                    index: i - 1,
                    width: nums[0], height: nums[1],
                    totalCount: nums[2], cols: nums[3], rows: nums[4],
                    intervalMs: nums[5] || 0,
                    sigh: sigh || globalSigh
                });
            }
            if (!levels.length) return null;
            return { template: template, levels: levels };
        }

        function sbSheetUrl(sb, level, sheetIdx) {
            let u = sb.template.replace('$L', String(level.index)).replace('$N', 'M' + sheetIdx);
            if (level.sigh) u += (u.indexOf('?') === -1 ? '?' : '&') + 'sigh=' + level.sigh;
            return u;
        }

        // FIX 3: dùng globalSheetCache thay vì local sheetImgs
        function makeBubbleRenderer(img, sb) {
            const level = sb.levels[sb.levels.length - 1];
            const perSheet = level.cols * level.rows;
            let alive = true;
            let appliedSheet = -1;
            let pCol = 0, pRow = 0, pSheet = -1;

            img.style.maxWidth = 'none';
            img.style.maxHeight = 'none';
            img.style.width = (level.cols * 100) + '%';
            img.style.height = (level.rows * 100) + '%';
            img.style.willChange = 'transform';

            const applyAt = (col, row) => {
                img.style.transform =
                    'translate(' + (-col * (100 / level.cols)) + '%, ' + (-row * (100 / level.rows)) + '%)';
            };

            return {
                render(timeMs) {
                    if (!level.intervalMs) return;
                    const frameIdx = Math.min(Math.round(timeMs / level.intervalMs), level.totalCount - 1);
                    const sheetIdx = Math.floor(frameIdx / perSheet);
                    const inSheet = frameIdx % perSheet;
                    const col = inSheet % level.cols;
                    const row = Math.floor(inSheet / level.cols);
                    pCol = col; pRow = row; pSheet = sheetIdx;

                    const sheetUrl = sbSheetUrl(sb, level, sheetIdx);
                    let im = globalSheetCache.get(sheetUrl);
                    if (!im) {
                        im = new Image();
                        im.src = sheetUrl;
                        im.addEventListener('load', () => {
                            if (!alive) return;
                            if (pSheet === sheetIdx && appliedSheet !== sheetIdx) {
                                appliedSheet = sheetIdx;
                                img.src = im.src;
                                applyAt(pCol, pRow);
                            }
                        }, { once: true });
                        globalSheetCache.set(sheetUrl, im);
                        sheetCacheTrim();
                    } else {
                        // Refresh LRU: delete và re-insert để đẩy xuống cuối
                        globalSheetCache.delete(sheetUrl);
                        globalSheetCache.set(sheetUrl, im);
                    }
                    if (im.complete && im.naturalWidth > 0) {
                        appliedSheet = sheetIdx;
                        if (img.src !== im.src) img.src = im.src;
                        applyAt(col, row);
                    }
                },
                destroy() { 
                    alive = false;
                    // FIX 3: KHÔNG clear global cache, chỉ remove closure ref
                }
            };
        }

        function resetBubbleImg() {
            bimg.removeAttribute('src');
            bimg.style.transform = 'none';
        }

        function bubbleDuration() {
            const d = bvid.duration;
            if (d && isFinite(d) && d > 0) return d;
            return duration;
        }

        function hideStill() {
            liveArmed = false;
            clearTimeout(seekTimer);
            if (pendingSeeked) {
                bvid.removeEventListener('seeked', pendingSeeked);
                pendingSeeked = null;
            }
            if (metaListener) {
                bvid.removeEventListener('loadedmetadata', metaListener);
                metaListener = null;
            }
            if (liveMode) {
                liveMode = false;
                bubble.classList.remove('pv-live');
            }
        }

        function issueSeek() {
            seekTimer = 0;
            const d = bubbleDuration();
            if (!d || !isFinite(d)) return;
            if (liveArmed || liveMode) return;
            if (lastFrac < 0) return;

            liveArmed = true;
            const target = lastFrac;

            const doSeek = () => {
                if (!liveArmed) return;
                if (pendingSeeked) bvid.removeEventListener('seeked', pendingSeeked);
                pendingSeeked = () => {
                    bvid.removeEventListener('seeked', pendingSeeked);
                    pendingSeeked = null;
                    if (!liveArmed) return;
                    liveArmed = false;
                    liveMode = true;
                    bubble.classList.add('pv-live');
                };
                bvid.addEventListener('seeked', pendingSeeked);
                try { bvid.currentTime = target * d; }
                catch (e) { hideStill(); }
            };

            if (bvid.readyState >= 1) doSeek();
            else {
                if (metaListener) bvid.removeEventListener('loadedmetadata', metaListener);
                metaListener = () => {
                    bvid.removeEventListener('loadedmetadata', metaListener);
                    metaListener = null;
                    doSeek();
                };
                bvid.addEventListener('loadedmetadata', metaListener);
            }
        }

        function armSeek() {
            clearTimeout(seekTimer);
            seekTimer = setTimeout(issueSeek, STILL_DEBOUNCE);
        }
        /* === BUBBLE STORYBOARD ADDON: END (STATE) === */

        let hideT = 0;
        bar.addEventListener('mouseenter', () => { clearTimeout(hideT); bar.classList.add('pv-show'); });
        bar.addEventListener('mouseleave', () => {
            hideT = setTimeout(() => bar.classList.remove('pv-show'), 900);
            hideBubble();
        });

        let dragging = false;
        let raf = 0, nextFrac = null;
        let moveRaf = 0;
        let lastMoveEvent = null;

        function processMove() {
            moveRaf = 0;
            if (!lastMoveEvent) return;
            const e = lastMoveEvent;
            lastMoveEvent = null;

            const f = fracFrom(e);
            moveBubble(e, f);
            if (dragging) queueSeekPlayer(f);
        }

        function fracFrom(e) {
            const r = track.getBoundingClientRect();
            return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        }
        function seekPlayer(f) {
            const d = bubbleDuration();
            /* === FALLBACK ADDON: BEGIN (SEEK) === */
            if (fallbackMode) {
                if (d > 0) { try { stageVid.currentTime = f * d; } catch (e) {} }
                return;
            }
            /* === FALLBACK ADDON: END (SEEK) === */
            if (apiReady && d > 0) { try { player.seekTo(f * d, true); } catch (e) {} }
        }
        function queueSeekPlayer(f) {
            nextFrac = f;
            if (raf) return;
            raf = requestAnimationFrame(() => { raf = 0; if (nextFrac !== null) seekPlayer(nextFrac); });
        }
        function moveBubble(e, f) {
            lastFrac = f;
            hideStill();

            bubble.style.opacity = '1';
            const bw = bubble.offsetWidth || 240;
            const x = Math.min(window.innerWidth - bw - 4, Math.max(4, e.clientX - bw / 2));
            bubble.style.left = x + 'px';
            const d = bubbleDuration();
            btime.textContent = fmt(f * (d || 0));

            if (streamUrl && !videoSrcAttached) {
                videoSrcAttached = true;
                bvid.src = streamUrl;
                bvid.muted = true;
                const p = bvid.play();
                if (p && typeof p.then === 'function') {
                    p.then(() => {
                        setTimeout(() => { try { bvid.pause(); } catch (e) {} }, 100);
                    }).catch(() => {});
                }
            }

            /* === BUBBLE STORYBOARD ADDON: BEGIN (RENDER + ARM) === */
            if (!sbRenderer && sbParsed) {
                sbRenderer = makeBubbleRenderer(bimg, sbParsed);
            }
            if (sbRenderer && d && isFinite(d)) {
                sbRenderer.render(f * d * 1000);
            }
            armSeek();
            /* === BUBBLE STORYBOARD ADDON: END (RENDER + ARM) === */
        }
        function hideBubble() {
            bubble.style.opacity = '0';
            lastFrac = -1;
            hideStill();
        }

        track.addEventListener('pointermove', (e) => {
            lastMoveEvent = e;
            if (!moveRaf) moveRaf = requestAnimationFrame(processMove);
        });
        track.addEventListener('pointerleave', () => { if (!dragging) hideBubble(); });
        track.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            dragging = true;
            hideStill();
            try { track.setPointerCapture(e.pointerId); } catch (err) {}
            const f = fracFrom(e);
            seekPlayer(f);
            moveBubble(e, f);
        });
        track.addEventListener('pointerup', () => {
            dragging = false;
            bubble.style.opacity = '0';
            hideStill();
        });

        bvid.addEventListener('error', () => { bvid.removeAttribute('src'); });
        /* === BUBBLE ADDON: END (LOGIC) === */

        window.addEventListener('message', function (event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) {
                streamUrl = null;
                videoSrcAttached = false;
                sbParsed = null;
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleImg();
                resetFallback();
                bvid.removeAttribute('src');
                try { bvid.load(); } catch (e) {}
                hideBubble();
                loadVideo(data.videoId);
            }
            if (data.type === 'stream' && data.url) {
                streamUrl = data.url;
                videoSrcAttached = false;
                sbParsed = parseStoryboardSpec(data.sb);
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleImg();
                if (fallbackPending) activateFallback();
            }
            if (data.type === 'stop') {
                stopVideo();
                streamUrl = null;
                videoSrcAttached = false;
                sbParsed = null;
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleImg();
                bvid.removeAttribute('src');
                try { bvid.load(); } catch (e) {}
                hideBubble();
                bar.classList.remove('pv-show');
            }

            /* === PERSISTENT CACHE BRIDGE: BEGIN (HANDLERS) === */
            if (data.type === 'cache-get' && data.id) {
                const e = lsLoad()[data.id];
                if (e && e.url) {
                    window.parent.postMessage({ type: 'cache-hit', id: data.id, url: e.url, ts: e.ts || 0, sb: e.sb || null }, PARENT_ORIGIN);
                } else {
                    window.parent.postMessage({ type: 'cache-miss', id: data.id }, PARENT_ORIGIN);
                }
            }
            if (data.type === 'cache-set' && data.id && data.url) {
                const o = lsLoad();
                o[data.id] = { url: data.url, ts: data.ts || Date.now(), sb: data.sb || null };
                lsPersist();
            }
            /* === PERSISTENT CACHE BRIDGE: END (HANDLERS) === */
        });

        window.addEventListener('beforeunload', () => {
            if (player) player.stopVideo();
        });
    </script>
</body>
</html>
