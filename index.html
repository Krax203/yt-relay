<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>

    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://googlevideo.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//googlevideo.com">
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }

        #pvstage {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain; display: none; background: #000; z-index: 1;
        }
        #pvstage.pv-fb { display: block; }

        /* === SHORTS PROGRESS BAR === */
        #shorts-progress {
            position: absolute;
            bottom: 15px; left: 0; right: 0;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            display: none;
        }
        #shorts-progress.pv-active { display: block; }
        #shorts-progress-fill {
            width: 100%; height: 100%;
            background: #f00;
            border-radius: 5px;
            transform-origin: 0 50%;
            transform: scaleX(0);
        }
        #shorts-progress:hover { height: 8px; }
    </style>
</head>
<body>
    <div id="player"></div>
    <video id="pvstage" muted playsinline preload="auto" controls></video>
    <div id="shorts-progress"><div id="shorts-progress-fill"></div></div>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';

        const playerEl = document.getElementById('player');
        const stageVid = document.getElementById('pvstage');
        const progressBar = document.getElementById('shorts-progress');
        const progressFill = document.getElementById('shorts-progress-fill');

        let player = null;
        let apiReady = false;
        let pendingUnmute = false;
        let pendingId = null;
        let currentId = null;
        let isShort = false;
        let progressTimer = null;
        let fallbackMode = false;
        let ytErrored = false;
        let streamUrl = null;

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        /* === SHORTS PROGRESS BAR: BEGIN === */
        function syncShortUI() {
            if (isShort && !fallbackMode) progressBar.classList.add('pv-active');
            else progressBar.classList.remove('pv-active');
        }
        function startProgressUpdate() {
            stopProgressUpdate();
            progressTimer = setInterval(() => {
                try {
                    const cur = player.getCurrentTime() || 0;
                    const dur = player.getDuration() || 0;
                    if (dur > 0) progressFill.style.transform = 'scaleX(' + (cur / dur) + ')';
                } catch (e) {}
            }, 100);
        }
        function stopProgressUpdate() {
            if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
        }
        function resetProgress() {
            stopProgressUpdate();
            progressFill.style.transform = 'scaleX(0)';
        }
        progressBar.addEventListener('click', (e) => {
            if (!player || !apiReady || fallbackMode) return;
            const rect = progressBar.getBoundingClientRect();
            if (!rect.width) return;
            const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            try {
                const dur = player.getDuration();
                if (dur > 0) player.seekTo(dur * frac, true);
                progressFill.style.transform = 'scaleX(' + frac + ')';
            } catch (err) {}
        });
        /* === SHORTS PROGRESS BAR: END === */

        /* === PERSISTENT CACHE BRIDGE: BEGIN === */
        const LS_KEY = 'pv_stream_cache_v2';
        let lsObj = null;
        let persistTimer = 0;

        function lsLoad() {
            if (lsObj) return lsObj;
            try {
                const raw = localStorage.getItem(LS_KEY);
                const obj = raw ? JSON.parse(raw) : {};
                lsObj = (obj && typeof obj === 'object') ? obj : {};
            } catch (e) { lsObj = {}; }
            return lsObj;
        }
        function lsPersist() {
            if (persistTimer) return;
            persistTimer = setTimeout(() => {
                persistTimer = 0;
                try {
                    const now = Date.now() / 1000;
                    const validEntries = Object.entries(lsObj).filter(([_, e]) => {
                        if (!e.url) return false;
                        const exp = (() => {
                            try { return Number(new URL(e.url).searchParams.get('expire')) || 0; }
                            catch (err) { return 0; }
                        })();
                        if (exp && now > exp - 60) return false;
                        return true;
                    });
                    let out = Object.fromEntries(validEntries);
                    if (validEntries.length > 300) {
                        validEntries.sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
                        out = Object.fromEntries(validEntries.slice(validEntries.length - 300));
                    }
                    lsObj = out;
                    localStorage.setItem(LS_KEY, JSON.stringify(out));
                } catch (e) {}
            }, 1000);
        }
        /* === PERSISTENT CACHE BRIDGE: END === */

        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin,
                    widget_referrer: window.location.origin,
                    disablekb: 1,
                    iv_load_policy: 3,
                    fs: 0,
                    cc_load_policy: 0
                },
                events: {
                    'onReady': () => {
                        apiReady = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        }
                        // FIX: xử lý pendingId - xóa dedupe-stale để load đang chờ chạy thực sự
                        if (pendingId) {
                            const id = pendingId;
                            pendingId = null;
                            currentId = null;
                            loadVideo(id);
                        }
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            if (pendingUnmute) {
                                pendingUnmute = false;
                                try { player.unMute(); } catch (err) {}
                            }
                            // NEW: start progress update cho Shorts
                            if (isShort && !fallbackMode) startProgressUpdate();
                        } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
                            stopProgressUpdate();
                        }
                    },
                    'onError': (e) => {
                        console.warn('YT error:', e.data);
                        // NEW: gửi yt-error message để parent kích hoạt fallback fetch
                        if (e.data === 100 || e.data === 101 || e.data === 150) {
                            ytErrored = true;
                            if (window.parent !== window) {
                                window.parent.postMessage({ type: 'yt-error', code: e.data }, PARENT_ORIGIN);
                            }
                        }
                    }
                }
            });
        };

        function loadVideo(videoId) {
            if (!videoId) return;
            if (!player || !apiReady) { pendingId = videoId; return; }
            if (currentId === videoId) { syncShortUI(); return; }
            currentId = videoId;
            resetProgress();
            try {
                player.mute();
                player.loadVideoById(videoId);
                pendingUnmute = true;
                syncShortUI();
            } catch (err) { console.warn('Load failed', err); }
        }

        function stopVideo() {
            pendingUnmute = false;
            currentId = null;
            pendingId = null;
            isShort = false;
            resetFallback();
            resetProgress();
            syncShortUI();
            if (player && apiReady) { try { player.stopVideo(); } catch (e) {} }
        }

        /* === FALLBACK: BEGIN === */
        stageVid.addEventListener('playing', () => {
            try { stageVid.muted = false; } catch (e) {}
        });
        stageVid.addEventListener('error', () => {
            console.warn('Fallback stage video error');
            stageVid.classList.remove('pv-fb');
            playerEl.style.display = '';
            fallbackMode = false;
        });

        function activateFallback() {
            if (fallbackMode || !streamUrl) return;
            fallbackMode = true;
            try { if (player && apiReady) player.stopVideo(); } catch (e) {}
            stopProgressUpdate();
            syncShortUI();
            playerEl.style.display = 'none';
            stageVid.classList.add('pv-fb');
            if (stageVid.getAttribute('src') !== streamUrl) stageVid.src = streamUrl;
            stageVid.muted = true;
            const p = stageVid.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
        }

        function resetFallback() {
            fallbackMode = false;
            ytErrored = false;
            stageVid.classList.remove('pv-fb');
            stageVid.removeAttribute('src');
            try { stageVid.load(); } catch (e) {}
            playerEl.style.display = '';
        }
        /* === FALLBACK: END === */

        window.addEventListener('message', function (event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) {
                streamUrl = null;
                isShort = !!data.isShort;
                resetFallback();
                loadVideo(data.videoId);
            }
            if (data.type === 'stream' && data.url) {
                streamUrl = data.url;
                // NEW: nếu đã có lỗi YouTube → kích hoạt fallback
                if (ytErrored && !fallbackMode) activateFallback();
            }
            if (data.type === 'stop') {
                stopVideo();
                streamUrl = null;
            }

            /* === PERSISTENT CACHE BRIDGE: BEGIN (HANDLERS) === */
            if (data.type === 'cache-get' && data.id) {
                const e = lsLoad()[data.id];
                if (e && e.url) {
                    window.parent.postMessage({ type: 'cache-hit', id: data.id, url: e.url, ts: e.ts || 0 }, PARENT_ORIGIN);
                } else {
                    window.parent.postMessage({ type: 'cache-miss', id: data.id }, PARENT_ORIGIN);
                }
            }
            if (data.type === 'cache-set' && data.id && data.url) {
                const o = lsLoad();
                o[data.id] = { url: data.url, ts: data.ts || Date.now() };
                lsPersist();
            }
            /* === PERSISTENT CACHE BRIDGE: END (HANDLERS) === */
        });

        window.addEventListener('beforeunload', () => {
            stopProgressUpdate();
            if (player) player.stopVideo();
        });
    </script>
</body>
</html>
