<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>
    
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }

        #pvstage {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain; display: none; background: #000; z-index: 1;
        }
        #pvstage.pv-fb { display: block; }
    </style>
</head>
<body>
    <div id="player"></div>
    <video id="pvstage" muted playsinline preload="none" controls></video>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';

        const playerEl = document.getElementById('player');
        const stageVid = document.getElementById('pvstage');

        let player = null;
        let apiReady = false;
        let pendingUnmute = false;
        let pendingId = null;
        let currentId = null;
        let fallbackMode = false;
        let ytErrored = false;
        let streamUrl = null;

        /* === STALL WATCHDOG: BEGIN === */
        let wdTimer = null;
        let wdLastFraction = null;
        let wdStallStart = 0;
        let wdDisabled = false; 
        let playedThisLoad = false; 
        const WD_CHECK_MS = 300;
        const WD_STALL_MS = 500;

        function wdStop() {
            if (wdTimer) { clearInterval(wdTimer); wdTimer = null; }
            wdLastFraction = null;
        }
        function wdStart() {
    
            if (wdDisabled || playedThisLoad) return;
            wdStop();
            wdStallStart = performance.now();
            wdTimer = setInterval(() => {
                if (!player || !apiReady || fallbackMode) return;
                let f = null;
                try { f = player.getVideoLoadedFraction(); } catch (e) {}
                if (f == null) return;

                if (wdLastFraction === null || f > wdLastFraction + 0.0005) {
                    wdLastFraction = f;
                    wdStallStart = performance.now();
                    return;
                }
                if (performance.now() - wdStallStart < WD_STALL_MS) return;

                const gaveUpId = currentId;
                wdStop();
                try { player.stopVideo(); } catch (e) {}
                currentId = null;
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'preview-stalled', videoId: gaveUpId }, PARENT_ORIGIN);
                }
            }, WD_CHECK_MS);
        }
        /* === STALL WATCHDOG: END === */

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function createPlayer() {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin,
                    widget_referrer: window.location.origin,
                    disablekb: 1,
                    iv_load_policy: 3,
                    fs: 0,
                    cc_load_policy: 0
                },
                events: {
                    'onReady': () => {
                        apiReady = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        }
                        if (pendingId) {
                            const id = pendingId;
                            pendingId = null;
                            currentId = null;
                            loadVideo(id);
                        }
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.BUFFERING) {
                            wdStart();
                        } else {
                            wdStop();
                        }
                        if (e.data === YT.PlayerState.PLAYING) {
                            playedThisLoad = true; 
                            if (pendingUnmute) {
                                pendingUnmute = false;
                                try { player.unMute(); } catch (err) {}
                            }
                        }
                    },
                    'onError': (e) => {
                        wdStop(); 
                        if (e.data === 100 || e.data === 101 || e.data === 150) {
                            ytErrored = true;
                            if (window.parent !== window) {
                                window.parent.postMessage({ type: 'yt-error', code: e.data }, PARENT_ORIGIN);
                            }
                        }
                    }
                }
            });
        }

        window.onYouTubeIframeAPIReady = function () {
            createPlayer();
        };

        function loadVideo(videoId) {
            if (!videoId) return;
            if (!player || !apiReady) { pendingId = videoId; return; }
            if (currentId === videoId) return;
            currentId = videoId;
            playedThisLoad = false; 
            try {
                player.mute();
                player.loadVideoById(videoId);
                pendingUnmute = true;
            } catch (err) { /* silent */ }
        }

        function stopVideo() {
            wdStop();
            wdDisabled = false;
            playedThisLoad = false;
            pendingUnmute = false;
            currentId = null;
            pendingId = null;
            resetFallback();
            if (player && apiReady) { try { player.stopVideo(); } catch (e) {} }
        }

        /* === FALLBACK: BEGIN === */
        stageVid.addEventListener('playing', () => {
            try { stageVid.muted = false; } catch (e) {}
        });
        stageVid.addEventListener('error', () => {
            stageVid.classList.remove('pv-fb');
            playerEl.style.display = '';
            fallbackMode = false;
        });

        function activateFallback() {
            if (fallbackMode || !streamUrl) return;
            wdStop();
            fallbackMode = true;
            try { if (player && apiReady) player.stopVideo(); } catch (e) {}
            playerEl.style.display = 'none';
            stageVid.classList.add('pv-fb');
            if (stageVid.getAttribute('src') !== streamUrl) stageVid.src = streamUrl;
            stageVid.muted = true;
            const p = stageVid.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
        }

        function resetFallback() {
            fallbackMode = false;
            ytErrored = false;
            stageVid.classList.remove('pv-fb');
            stageVid.removeAttribute('src');
            try { stageVid.load(); } catch (e) {}
            playerEl.style.display = '';
        }
        /* === FALLBACK: END === */

        window.addEventListener('message', function (event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) {
                streamUrl = null;
                wdDisabled = !!data.isRetry;
                resetFallback();
                loadVideo(data.videoId);
            }
            if (data.type === 'stream' && data.url) {
                streamUrl = data.url;
                if (ytErrored && !fallbackMode) activateFallback();
            }
            if (data.type === 'stop') {
                stopVideo();
                streamUrl = null;
            }
        });

        window.addEventListener('beforeunload', () => {
            if (player) player.stopVideo();
        });
    </script>
</body>
</html>
