<!DOCTYPE html>
<html><head><style>html,body{margin:0;padding:0;background:#000;overflow:hidden;}
#player{width:100vw;height:100vh;}</style></head>
<body>
<div id="player"></div>
<script>
const PARENT_ORIGIN = 'https://www.youtube.com';
let player = null, apiReady = false;

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.body.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('player', {
        width: '100%', height: '100%',
        playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, playsinline: 1 },
        events: {
            onReady: () => {
                apiReady = true;
                parent.postMessage({ type: 'relay-ready' }, PARENT_ORIGIN);
            }
        }
    });
};

window.addEventListener('message', (e) => {
    if (e.origin !== PARENT_ORIGIN || !apiReady) return;
    const { type, videoId } = e.data || {};
    if (type === 'load') { player.loadVideoById(videoId); player.mute(); player.playVideo(); }
    else if (type === 'stop') { player.stopVideo(); }
});
</script>
</body></html>
