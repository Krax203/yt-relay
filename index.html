<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>

    <!-- Preconnect & Preload tối đa tốc độ mạng -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        #status { display: none; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';

        let player = null;
        let apiReady = false;
        let pendingUnmute = false;

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    origin: window.location.origin
                },
                events: {
                    'onReady': (e) => {
                        apiReady = true;
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        }
                        const videoId = new URLSearchParams(window.location.search).get('v');
                        if (videoId) loadVideo(videoId);
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING && pendingUnmute) {
                            pendingUnmute = false;
                            try { player.unMute(); } catch (err) {}
                        }
                    }
                }
            });
        };

        function loadVideo(videoId) {
            if (!player || !apiReady) return;
            try {
                player.mute();
                player.loadVideoById(videoId);
                pendingUnmute = true;
            } catch (err) {}
        }

        function stopVideo() {
            pendingUnmute = false;
            if (player) player.stopVideo();
        }

        window.addEventListener('message', function(event) {
            if (PARENT_ORIGIN !== '*' && event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) loadVideo(data.videoId);
            if (data.type === 'stop') stopVideo();
        });

        window.addEventListener('beforeunload', () => {
            if (player) player.stopVideo();
        });
    </script>
</body>
</html>
