<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>

    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://googlevideo.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//googlevideo.com">
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }

        #pvstage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; background: #000; z-index: 1; }
        #pvstage.pv-fb { display: block; }

        #pvbar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: linear-gradient(transparent, rgba(0,0,0,.78)); opacity: 0; transition: opacity .25s; pointer-events: auto; }
        #pvbar.pv-show { opacity: 1; }
        #pvbar .time { color: #fff; font: 11px/1.2 sans-serif; text-shadow: 0 1px 2px #000; white-space: nowrap; flex: 0 0 auto; }
        #pvtrack { position: relative; flex: 1 1 auto; height: 20px; cursor: pointer; }
        #pvtrack::before { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; }
        #pvfill { position: absolute; left: 0; top: 8px; height: 4px; width: 0; background: #f00; border-radius: 2px; }
        
        #pvbubble { position: absolute; bottom: 50px; left: 0; width: min(240px, 62%); aspect-ratio: 16 / 9; background: #000; border: 2px solid #fff; border-radius: 6px; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .12s, aspect-ratio .2s ease; z-index: 11; }
        #pvbubble canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; transition: opacity .15s ease-out; opacity: 1; }
        #pvbubble video { width: 100%; height: 100%; object-fit: contain; display: block; position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; transition: opacity .15s ease-out; opacity: 0; }
        #pvbubble.pv-live canvas { opacity: 0; }
        #pvbubble.pv-live video { opacity: 1; }
        
        #pvbtime { position: absolute; right: 4px; bottom: 2px; color: #fff; font: 11px/1.2 sans-serif; background: rgba(0,0,0,.7); padding: 2px 5px; border-radius: 3px; z-index: 10; }
    </style>
</head>
<body>
    <div id="player"></div>
    <video id="pvstage" muted playsinline preload="auto"></video>

    <div id="pvbar">
        <div id="pvtrack"><div id="pvfill"></div></div>
        <div id="pvtime" class="time">0:00 / 0:00</div>
    </div>
    <div id="pvbubble">
        <canvas id="pvbcanvas"></canvas>
        <video id="pvbvid" muted playsinline preload="auto"></video>
        <div id="pvbtime">0:00</div>
    </div>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';
        let player = null, apiReady = false, pendingUnmute = false, pendingId = null, currentId = null;

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function fmt(s) {
            s = Math.max(0, Math.floor(s || 0));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
        }

        const LS_KEY = 'pv_stream_cache_v1';
        let lsObj = null, persistTimer = 0;
        
        function lsLoad() {
            if (lsObj) return lsObj;
            try { lsObj = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } 
            catch (e) { lsObj = {}; }
            return lsObj;
        }
        
        function lsPersist() {
            if (persistTimer) return;
            persistTimer = setTimeout(() => {
                persistTimer = 0;
                try {
                    const now = Date.now() / 1000;
                    const validEntries = Object.entries(lsObj).filter(([_, e]) => {
                        if (!e.url) return false;
                        let exp = 0;
                        try { exp = Number(new URL(e.url).searchParams.get('expire')) || 0; } catch (err) {}
                        return !(exp && now > exp - 60);
                    });
                    lsObj = validEntries.length > 300 
                        ? Object.fromEntries(validEntries.sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0)).slice(-300))
                        : Object.fromEntries(validEntries);
                    localStorage.setItem(LS_KEY, JSON.stringify(lsObj));
                } catch (e) {}
            }, 1000);
        }

        let progTimer = 0, progRunning = false, duration = 0;
        function updateProgress() {
            progTimer = 0;
            if (!player || !apiReady) { progRunning = false; return; }

            if (fallbackMode) {
                const d = stageVid.duration || 0;
                duration = d;
                if (barVisible() && d > 0) {
                    fill.style.width = ((stageVid.currentTime || 0) / d * 100) + '%';
                    timeLab.textContent = fmt(stageVid.currentTime) + ' / ' + fmt(d);
                }
                if (!stageVid.paused && !stageVid.ended) progTimer = setTimeout(updateProgress, barVisible() ? 100 : 500);
                else progRunning = false;
                return;
            }

            let playing = false;
            try { playing = player.getPlayerState() === YT.PlayerState.PLAYING; } catch (e) {}
            if (!playing) { progRunning = false; return; }
            
            try {
                duration = player.getDuration() || 0;
                if (barVisible() && duration > 0) {
                    const cur = player.getCurrentTime() || 0;
                    fill.style.width = (cur / duration * 100) + '%';
                    timeLab.textContent = fmt(cur) + ' / ' + fmt(duration);
                }
            } catch (e) {}
            progTimer = setTimeout(updateProgress, barVisible() ? 100 : 500);
        }
        
        function ensureProgressLoop() {
            if (progRunning) return;
            progRunning = true;
            if (!progTimer) progTimer = setTimeout(updateProgress, 100);
        }
        function stopProgressLoop() {
            if (progTimer) { clearTimeout(progTimer); progTimer = 0; }
            progRunning = false;
        }

        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%', height: '100%',
                playerVars: { autoplay: 0, controls: 1, modestbranding: 1, rel: 0, playsinline: 1, enablejsapi: 1, origin: window.location.origin, widget_referrer: window.location.origin, disablekb: 1, iv_load_policy: 3, fs: 0, cc_load_policy: 0 },
                events: {
                    'onReady': () => {
                        apiReady = true;
                        if (window.parent !== window) window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN);
                        if (pendingId) { loadVideo(pendingId); pendingId = null; }
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            ensureProgressLoop();
                            if (pendingUnmute) { pendingUnmute = false; try { player.unMute(); } catch (err) {} }
                        }
                    },
                    'onError': (e) => {
                        if (e.data === 100 || e.data === 101 || e.data === 150) requestFallback();
                    }
                }
            });
        };

        function loadVideo(videoId) {
            if (!videoId || currentId === videoId) return;
            currentId = videoId;
            if (!player || !apiReady) { pendingId = videoId; return; }
            try { player.mute(); player.loadVideoById(videoId); pendingUnmute = true; } catch (err) {}
        }

        function stopVideo() {
            pendingUnmute = false; currentId = null; pendingId = null;
            stopProgressLoop(); resetFallback();
            if (player && apiReady) { try { player.stopVideo(); } catch (e) {} }
        }

        const playerEl = document.getElementById('player');
        const stageVid = document.getElementById('pvstage');
        let fallbackMode = false, fallbackPending = false;

        stageVid.addEventListener('playing', () => { try { stageVid.muted = false; } catch (e) {} });
        stageVid.addEventListener('error', () => { stageVid.classList.remove('pv-fb'); playerEl.style.display = ''; fallbackMode = false; });

        function requestFallback() { if (fallbackMode) return; if (streamUrl) activateFallback(); else fallbackPending = true; }

        function activateFallback() {
            if (fallbackMode || !streamUrl) return;
            fallbackMode = true; fallbackPending = false;
            try { if (player && apiReady) player.stopVideo(); } catch (e) {}
            stopProgressLoop(); playerEl.style.display = 'none'; stageVid.classList.add('pv-fb');
            if (stageVid.getAttribute('src') !== streamUrl) stageVid.src = streamUrl;
            stageVid.muted = true;
            const p = stageVid.play(); if (p?.catch) p.catch(() => {});
            ensureProgressLoop();
        }

        function resetFallback() {
            fallbackMode = false; fallbackPending = false;
            stageVid.classList.remove('pv-fb'); stageVid.removeAttribute('src');
            try { stageVid.load(); } catch (e) {}
            playerEl.style.display = '';
        }

        const bar = document.getElementById('pvbar');
        const track = document.getElementById('pvtrack');
        const fill = document.getElementById('pvfill');
        const timeLab = document.getElementById('pvtime');
        const bubble = document.getElementById('pvbubble');
        const bcanvas = document.getElementById('pvbcanvas');
        const bctx = bcanvas.getContext('2d', { alpha: false });
        const bvid = document.getElementById('pvbvid');
        const btime = document.getElementById('pvbtime');

        function barVisible() { return bar.classList.contains('pv-show'); }

        let streamUrl = null, videoSrcAttached = false;
        let aspectLocked = false;

        function setBubbleAspect(w, h, lock = false) {
            if (aspectLocked) return;
            bubble.style.aspectRatio = (w && h && w > 0 && h > 0 && (w/h >= 0.5 && w/h <= 2.0)) ? `${w} / ${h}` : '16 / 9';
            if (lock) aspectLocked = true;
        }

        let sbParsed = null, sbRenderer = null, lastFrac = -1, liveArmed = false, liveMode = false;
        let seekAbort = null, metaAbort = null, seekTimer = 0;
        const STILL_DEBOUNCE = 120;

        function parseStoryboardSpec(spec) {
            if (!spec || typeof spec !== 'string') return null;
            const parts = spec.split('|');
            const template = parts[0];
            let globalSigh = '';
            const last = parts[parts.length - 1];
            if (!last.includes('#')) globalSigh = last;
            const levels = [];
            for (let i = 1; i < parts.length; i++) {
                const fields = parts[i].split('#');
                const nums = []; let j = 0;
                while (j < fields.length && /^\d+$/.test(fields[j])) { nums.push(Number(fields[j])); j++; }
                if (nums.length < 6) continue;
                let sigh = fields[j] === 'M$M' ? (fields[j + 1] || '') : '';
                levels.push({ index: i - 1, width: nums[0], height: nums[1], totalCount: nums[2], cols: nums[3], rows: nums[4], intervalMs: nums[5] || 0, sigh: sigh || globalSigh });
            }
            return levels.length ? { template, levels } : null;
        }

        function sbSheetUrl(sb, level, sheetIdx) {
            let u = sb.template.replace('$L', String(level.index)).replace('$N', 'M' + sheetIdx);
            if (level.sigh) u += (u.indexOf('?') === -1 ? '?' : '&') + 'sigh=' + level.sigh;
            return u;
        }

        function makeBubbleRenderer(canvas, ctx, sb) {
            const level = sb.levels[sb.levels.length - 1];
            const perSheet = level.cols * level.rows;
            const sheetImgs = new Map();
            let alive = true, lastSheet = -1, lastCol = -1, lastRow = -1;

            const baseW = 480;
            const baseH = Math.round(baseW * (level.height / level.width));
            canvas.width = baseW; canvas.height = baseH;

            function drawFrame(imData, col, row) {
                const im = imData.img;
                const realW = im.naturalWidth / level.cols;
                const realH = im.naturalHeight / level.rows;
                const dr = imData.destRect;
                ctx.drawImage(im, col * realW, row * realH, realW, realH, dr.dx, dr.dy, dr.dw, dr.dh);
            }

            return {
                render(timeMs) {
                    if (!level.intervalMs) return;
                    const frameIdx = Math.min(Math.round(timeMs / level.intervalMs), level.totalCount - 1);
                    const sheetIdx = Math.floor(frameIdx / perSheet);
                    const inSheet = frameIdx % perSheet;
                    const col = inSheet % level.cols;
                    const row = Math.floor(inSheet / level.cols);

                    let imData = sheetImgs.get(sheetIdx);
                    if (!imData) {
                        const im = new Image();
                        im.src = sbSheetUrl(sb, level, sheetIdx);
                        imData = { img: im, destRect: { dx: 0, dy: 0, dw: baseW, dh: baseH } };
                        
                        im.addEventListener('load', () => {
                            if (!alive) return;
                            const realW = im.naturalWidth / level.cols;
                            const realH = im.naturalHeight / level.rows;
                            const canvasAspect = baseW / baseH;
                            const frameAspect = realW / realH;
                            const dr = imData.destRect;
                            
                            if (frameAspect > canvasAspect) { dr.dh = baseW / frameAspect; dr.dy = (baseH - dr.dh) / 2; } 
                            else { dr.dw = baseH * frameAspect; dr.dx = (baseW - dr.dw) / 2; }

                            if (sheetIdx === lastSheet && col === lastCol && row === lastRow) drawFrame(imData, col, row);
                        }, { once: true });
                        sheetImgs.set(sheetIdx, imData);
                    }
                    
                    if (sheetIdx === lastSheet && col === lastCol && row === lastRow) return;
                    lastSheet = sheetIdx; lastCol = col; lastRow = row;
                    if (imData.img.complete && imData.img.naturalWidth > 0) drawFrame(imData, col, row);
                },
                destroy() {
                    alive = false;
                    sheetImgs.forEach(data => { data.img.src = ''; });
                    sheetImgs.clear();
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            };
        }

        function resetBubbleCanvas() { bctx.clearRect(0, 0, bcanvas.width, bcanvas.height); }
        function bubbleDuration() { const d = bvid.duration; return (d && isFinite(d) && d > 0) ? d : duration; }

        // FIX MEMORY LEAK: Dùng AbortController để hủy listener triệt để
        function hideStill() {
            liveArmed = false;
            clearTimeout(seekTimer);
            if (seekAbort) { seekAbort.abort(); seekAbort = null; }
            if (metaAbort) { metaAbort.abort(); metaAbort = null; }
            if (liveMode) { liveMode = false; bubble.classList.remove('pv-live'); }
        }

        function issueSeek() {
            seekTimer = 0;
            const d = bubbleDuration();
            if (!d || !isFinite(d) || liveArmed || liveMode || lastFrac < 0) return;

            liveArmed = true;
            const target = lastFrac;

            const doSeek = () => {
                if (!liveArmed) return;
                const pendingSeeked = () => {
                    if (!liveArmed) return;
                    liveArmed = false; liveMode = true; bubble.classList.add('pv-live');
                };
                seekAbort = new AbortController();
                bvid.addEventListener('seeked', pendingSeeked, { once: true, signal: seekAbort.signal });
                try { bvid.currentTime = target * d; } catch (e) { hideStill(); }
            };

            if (bvid.readyState >= 1) doSeek();
            else {
                metaAbort = new AbortController();
                bvid.addEventListener('loadedmetadata', () => { if (liveArmed) doSeek(); }, { once: true, signal: metaAbort.signal });
            }
        }

        function armSeek() { clearTimeout(seekTimer); seekTimer = setTimeout(issueSeek, STILL_DEBOUNCE); }

        let hideT = 0;
        bar.addEventListener('mouseenter', () => { clearTimeout(hideT); bar.classList.add('pv-show'); });
        bar.addEventListener('mouseleave', () => { hideT = setTimeout(() => bar.classList.remove('pv-show'), 900); hideBubble(); });

        let dragging = false, raf = 0, nextFrac = null, moveRaf = 0, lastMoveEvent = null;

        function processMove() {
            moveRaf = 0; if (!lastMoveEvent) return;
            const e = lastMoveEvent; lastMoveEvent = null;
            const f = fracFrom(e); moveBubble(e, f);
            if (dragging) queueSeekPlayer(f);
        }

        function fracFrom(e) { const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
        
        function seekPlayer(f) {
            const d = bubbleDuration();
            if (fallbackMode) { if (d > 0) try { stageVid.currentTime = f * d; } catch (e) {} return; }
            if (apiReady && d > 0) try { player.seekTo(f * d, true); } catch (e) {}
        }
        
        function queueSeekPlayer(f) {
            nextFrac = f; if (raf) return;
            raf = requestAnimationFrame(() => { raf = 0; if (nextFrac !== null) seekPlayer(nextFrac); });
        }

        function moveBubble(e, f) {
            lastFrac = f; hideStill();
            bubble.style.opacity = '1';
            const bw = bubble.offsetWidth || 240;
            bubble.style.left = Math.min(window.innerWidth - bw - 4, Math.max(4, e.clientX - bw / 2)) + 'px';
            btime.textContent = fmt(f * (bubbleDuration() || 0));

            if (streamUrl && !videoSrcAttached) {
                videoSrcAttached = true; bvid.src = streamUrl; bvid.muted = true;
                const onPreloadMeta = () => {
                    if (lastFrac < 0) return;
                    if (bvid.duration && isFinite(bvid.duration)) {
                        try {
                            bvid.currentTime = lastFrac * bvid.duration;
                            const p = bvid.play();
                            if (p?.then) p.then(() => { setTimeout(() => { try { bvid.pause(); } catch (err) {} }, 100); }).catch(() => {});
                        } catch (err) {}
                    }
                };
                metaAbort = new AbortController();
                bvid.addEventListener('loadedmetadata', onPreloadMeta, { once: true, signal: metaAbort.signal });
            }

            if (!sbRenderer && sbParsed) sbRenderer = makeBubbleRenderer(bcanvas, bctx, sbParsed);
            if (sbRenderer && bubbleDuration() && isFinite(bubbleDuration())) sbRenderer.render(f * bubbleDuration() * 1000);
            armSeek();
        }

        function hideBubble() { 
            bubble.style.opacity = '0'; 
            lastFrac = -1; 
            hideStill(); 
            try { bvid.pause(); } catch(e) {}
        }

        track.addEventListener('pointermove', (e) => { lastMoveEvent = e; if (!moveRaf) moveRaf = requestAnimationFrame(processMove); });
        track.addEventListener('pointerleave', () => { if (!dragging) hideBubble(); });
        track.addEventListener('pointerdown', (e) => {
            e.preventDefault(); dragging = true; hideStill();
            try { track.setPointerCapture(e.pointerId); } catch (err) {}
            const f = fracFrom(e); seekPlayer(f); moveBubble(e, f);
        });
        track.addEventListener('pointerup', () => { dragging = false; bubble.style.opacity = '0'; hideStill(); });
        bvid.addEventListener('error', () => { bvid.removeAttribute('src'); });

        window.addEventListener('message', function (event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data; if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) {
                streamUrl = null; videoSrcAttached = false; sbParsed = null;
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleCanvas(); resetFallback(); bvid.removeAttribute('src');
                try { bvid.load(); } catch (e) {}
                hideBubble(); aspectLocked = false; setBubbleAspect(16, 9);
                loadVideo(data.videoId);
            }
            if (data.type === 'stream' && data.url) {
                streamUrl = data.url; videoSrcAttached = false; sbParsed = parseStoryboardSpec(data.sb);
                if (sbParsed?.levels?.length) {
                    const lvl = sbParsed.levels[sbParsed.levels.length - 1];
                    setBubbleAspect(lvl.width, lvl.height, true);
                } else { setBubbleAspect(16, 9, true); }
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleCanvas(); if (fallbackPending) activateFallback();
            }
            if (data.type === 'stop') {
                stopVideo(); streamUrl = null; videoSrcAttached = false; sbParsed = null;
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleCanvas(); bvid.removeAttribute('src');
                try { bvid.load(); } catch (e) {}
                hideBubble(); bar.classList.remove('pv-show'); aspectLocked = false; setBubbleAspect(16, 9);
            }

            if (data.type === 'cache-get' && data.id) {
                const e = lsLoad()[data.id];
                if (e?.url) window.parent.postMessage({ type: 'cache-hit', id: data.id, url: e.url, ts: e.ts || 0, sb: e.sb || null }, PARENT_ORIGIN);
                else window.parent.postMessage({ type: 'cache-miss', id: data.id }, PARENT_ORIGIN);
            }
            if (data.type === 'cache-set' && data.id && data.url) {
                const o = lsLoad();
                o[data.id] = { url: data.url, ts: data.ts || Date.now(), sb: data.sb || null };
                lsPersist();
            }
        });

        window.addEventListener('beforeunload', () => { if (player) player.stopVideo(); });
    </script>
</body>
</html>
