<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Relay</title>
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://googlevideo.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//googlevideo.com">
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        #pvstage {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain; display: none; background: #000; z-index: 1;
        }
        #pvstage.pv-fb { display: block; }
        #pvbar {
            position: absolute; left: 0; right: 0; bottom: 0; height: 44px; z-index: 10;
            display: flex; align-items: center; gap: 8px; padding: 0 10px;
            background: linear-gradient(transparent, rgba(0,0,0,.78));
            opacity: 0; transition: opacity .25s; pointer-events: auto;
        }
        #pvbar.pv-show { opacity: 1; }
        #pvbar .time {
            color: #fff; font: 11px/1.2 sans-serif; text-shadow: 0 1px 2px #000;
            white-space: nowrap; flex: 0 0 auto;
        }
        #pvtrack { position: relative; flex: 1 1 auto; height: 20px; cursor: pointer; }
        #pvtrack::before {
            content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 4px;
            background: rgba(255,255,255,.25); border-radius: 2px;
        }
        #pvfill {
            position: absolute; left: 0; top: 8px; height: 4px; width: 0;
            background: #f00; border-radius: 2px;
        }
        #pvbubble {
            position: absolute; bottom: 50px; left: 0;
            width: min(240px, 62%);
            max-height: 260px;
            aspect-ratio: 16 / 9;
            background: #000; border: 2px solid #fff; border-radius: 6px;
            overflow: hidden; opacity: 0; pointer-events: none;
            transition: opacity .12s, aspect-ratio .2s ease, width .2s ease, height .2s ease;
            z-index: 11;
        }

        /* Storyboard frame: dùng background thay vì img+transform */
        #pvbimg {
            position: absolute; inset: 0;
            background-repeat: no-repeat;
            background-color: #000;
            z-index: 1;
            pointer-events: none;
            transition: opacity .15s ease-out;
            opacity: 1;
        }

        #pvbubble video {
            width: 100%; height: 100%; object-fit: contain; display: block;
            position: absolute; top: 0; left: 0; z-index: 2;
            pointer-events: none; transition: opacity .15s ease-out;
            opacity: 0;
        }
        #pvbubble.pv-live #pvbimg { opacity: 0; }
        #pvbubble.pv-live video { opacity: 1; }
        #pvbtime {
            position: absolute; right: 4px; bottom: 2px; color: #fff;
            font: 11px/1.2 sans-serif; background: rgba(0,0,0,.7);
            padding: 2px 5px; border-radius: 3px; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <video id="pvstage" muted playsinline preload="auto"></video>
    <div id="pvbar">
        <div id="pvtrack"><div id="pvfill"></div></div>
        <div id="pvtime" class="time">0:00 / 0:00</div>
    </div>
    <div id="pvbubble">
        <div id="pvbimg"></div>
        <video id="pvbvid" muted playsinline preload="auto"></video>
        <div id="pvbtime">0:00</div>
    </div>

    <script>
        const PARENT_ORIGIN = 'https://www.youtube.com';
        let player = null, apiReady = false, pendingUnmute = false, pendingId = null, currentId = null;
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function fmt(s) {
            s = Math.max(0, Math.floor(s || 0));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 3600 % 60;
            return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
        }

        const LS_KEY = 'pv_stream_cache_v1';
        let lsObj = null, persistTimer = 0;
        function lsLoad() {
            if (lsObj) return lsObj;
            try { const r = localStorage.getItem(LS_KEY); const o = r ? JSON.parse(r) : {}; lsObj = (o && typeof o === 'object') ? o : {}; } catch (e) { lsObj = {}; }
            return lsObj;
        }
        function lsPersist() {
            if (persistTimer) return;
            persistTimer = setTimeout(() => {
                persistTimer = 0;
                try {
                    const now = Date.now() / 1000;
                    const valid = Object.entries(lsObj).filter(([_, e]) => {
                        if (!e.url) return false;
                        const exp = (() => { try { return Number(new URL(e.url).searchParams.get('expire')) || 0; } catch (x) { return 0; } })();
                        return !(exp && now > exp - 60);
                    });
                    let out = Object.fromEntries(valid);
                    if (valid.length > 300) { valid.sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0)); out = Object.fromEntries(valid.slice(valid.length - 300)); }
                    lsObj = out;
                    localStorage.setItem(LS_KEY, JSON.stringify(out));
                } catch (e) {}
            }, 1000);
        }

        let progTimer = 0, progRunning = false;
        function updateProgress() {
            progTimer = 0;
            if (!player || !apiReady) { progRunning = false; return; }
            if (fallbackMode) {
                const d = stageVid.duration || 0; duration = d;
                if (barVisible() && d > 0) { const c = stageVid.currentTime || 0; fill.style.width = (c / d * 100) + '%'; timeLab.textContent = fmt(c) + ' / ' + fmt(d); }
                if (!stageVid.paused && !stageVid.ended) progTimer = setTimeout(updateProgress, barVisible() ? 100 : 500);
                else progRunning = false;
                return;
            }
            let playing = false;
            try { playing = player.getPlayerState() === YT.PlayerState.PLAYING; } catch (e) {}
            if (!playing) { progRunning = false; return; }
            try {
                duration = player.getDuration() || 0;
                if (barVisible()) { const c = player.getCurrentTime() || 0; if (duration > 0) { fill.style.width = (c / duration * 100) + '%'; timeLab.textContent = fmt(c) + ' / ' + fmt(duration); } }
            } catch (e) {}
            progTimer = setTimeout(updateProgress, barVisible() ? 100 : 500);
        }
        function ensureProgressLoop() { if (progRunning) return; progRunning = true; if (!progTimer) progTimer = setTimeout(updateProgress, 100); }
        function stopProgressLoop() { if (progTimer) { clearTimeout(progTimer); progTimer = 0; } progRunning = false; }

        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%', height: '100%',
                playerVars: { autoplay: 0, controls: 1, modestbranding: 1, rel: 0, playsinline: 1, enablejsapi: 1, origin: window.location.origin, widget_referrer: window.location.origin, disablekb: 1, iv_load_policy: 3, fs: 0, cc_load_policy: 0 },
                events: {
                    'onReady': () => { apiReady = true; if (window.parent !== window) window.parent.postMessage({ type: 'relay-ready', status: 'ready' }, PARENT_ORIGIN); if (pendingId) { loadVideo(pendingId); pendingId = null; } },
                    'onStateChange': (e) => { if (e.data === YT.PlayerState.PLAYING) { ensureProgressLoop(); if (pendingUnmute) { pendingUnmute = false; try { player.unMute(); } catch (x) {} } } },
                    'onError': (e) => { if (e.data === 100 || e.data === 101 || e.data === 150) requestFallback(); }
                }
            });
        };

        function loadVideo(videoId) {
            if (!videoId || currentId === videoId) return;
            currentId = videoId;
            if (!player || !apiReady) { pendingId = videoId; return; }
            try { player.mute(); player.loadVideoById(videoId); pendingUnmute = true; } catch (e) {}
        }
        function stopVideo() {
            pendingUnmute = false; currentId = null; pendingId = null;
            stopProgressLoop(); resetFallback();
            if (player && apiReady) { try { player.stopVideo(); } catch (e) {} }
        }

        const playerEl = document.getElementById('player');
        const stageVid = document.getElementById('pvstage');
        let fallbackMode = false, fallbackPending = false;
        stageVid.addEventListener('playing', () => { try { stageVid.muted = false; } catch (e) {} });
        stageVid.addEventListener('error', () => { stageVid.classList.remove('pv-fb'); playerEl.style.display = ''; fallbackMode = false; });
        function requestFallback() { if (fallbackMode) return; if (streamUrl) activateFallback(); else fallbackPending = true; }
        function activateFallback() {
            if (fallbackMode || !streamUrl) return;
            fallbackMode = true; fallbackPending = false;
            try { if (player && apiReady) player.stopVideo(); } catch (e) {}
            stopProgressLoop(); playerEl.style.display = 'none'; stageVid.classList.add('pv-fb');
            if (stageVid.getAttribute('src') !== streamUrl) stageVid.src = streamUrl;
            stageVid.muted = true;
            const p = stageVid.play(); if (p && typeof p.catch === 'function') p.catch(() => {});
            ensureProgressLoop();
        }
        function resetFallback() {
            fallbackMode = false; fallbackPending = false;
            stageVid.classList.remove('pv-fb'); stageVid.removeAttribute('src');
            try { stageVid.load(); } catch (e) {} playerEl.style.display = '';
        }

        const bar = document.getElementById('pvbar');
        const track = document.getElementById('pvtrack');
        const fill = document.getElementById('pvfill');
        const timeLab = document.getElementById('pvtime');
        const bubble = document.getElementById('pvbubble');
        const bimg = document.getElementById('pvbimg');
        const bvid = document.getElementById('pvbvid');
        const btime = document.getElementById('pvbtime');

        function barVisible() { return bar.classList.contains('pv-show'); }
        let streamUrl = null, videoSrcAttached = false, duration = 0;

        function setBubbleAspect(w, h) {
            if (w && h && w > 0 && h > 0) {
                const r = w / h;
                bubble.style.aspectRatio = (r >= 0.5 && r <= 2.0) ? `${w} / ${h}` : '16 / 9';
            } else bubble.style.aspectRatio = '16 / 9';
        }

        let sbParsed = null, sbRenderer = null, lastFrac = -1;
        let liveArmed = false, liveMode = false, pendingSeeked = null, metaListener = null, seekTimer = 0;
        const STILL_DEBOUNCE = 120;

        function parseStoryboardSpec(spec) {
            if (!spec || typeof spec !== 'string') return null;
            const parts = spec.split('|');
            const template = parts[0];
            let globalSigh = '';
            const last = parts[parts.length - 1];
            if (!last.includes('#')) globalSigh = last;
            const levels = [];
            for (let i = 1; i < parts.length; i++) {
                const fields = parts[i].split('#');
                const nums = [];
                let j = 0;
                while (j < fields.length && /^\d+$/.test(fields[j])) { nums.push(Number(fields[j])); j++; }
                if (nums.length < 6) continue;
                let sigh = '';
                if (fields[j] === 'M$M') sigh = fields[j + 1] || '';
                levels.push({ index: i - 1, width: nums[0], height: nums[1], totalCount: nums[2], cols: nums[3], rows: nums[4], intervalMs: nums[5] || 0, sigh: sigh || globalSigh });
            }
            if (!levels.length) return null;
            return { template, levels };
        }

        function sbSheetUrl(sb, level, sheetIdx) {
            let u = sb.template.replace('$L', String(level.index)).replace('$N', 'M' + sheetIdx);
            if (level.sigh) u += (u.indexOf('?') === -1 ? '?' : '&') + 'sigh=' + level.sigh;
            return u;
        }

        /* ================================================================
           BACKGROUND-IMAGE RENDERER
           
           Dùng background-size + background-position thay vì img+transform.
           
           Luồng hoạt động:
           1. Preload sprite sheet bằng Image() để lấy naturalWidth/Height
           2. Tính frameW/H thực = natural / cols,rows
           3. Contain scale: fit frame vào container
           4. background-size = toàn sheet sau scale
           5. background-position = offset để hiển thị đúng frame + căn giữa
           6. Div #pvbimg tự làm viewport (inset:0 trong bubble)
           ================================================================ */
        function makeBubbleRenderer(el, sb) {
            const level = sb.levels[sb.levels.length - 1];
            const perSheet = level.cols * level.rows;
            const sheetCache = new Map(); // sheetIdx -> { img, url, loaded }
            let alive = true;
            let appliedSheet = -1;
            let pCol = 0, pRow = 0, pSheet = -1;
            let currentUrl = '';

            const applyAt = (col, row, natW, natH) => {
                const cW = bubble.clientWidth;
                const cH = bubble.clientHeight;
                if (!cW || !cH || !natW || !natH) return;

                // Frame thực từ ảnh đã tải
                const fW = natW / level.cols;
                const fH = natH / level.rows;

                // Contain scale
                const scale = Math.min(cW / fW, cH / fH);

                // Toàn sheet sau scale
                const bgW = Math.round(natW * scale);
                const bgH = Math.round(natH * scale);

                // 1 frame sau scale
                const dW = fW * scale;
                const dH = fH * scale;

                // Căn giữa frame trong container
                const cx = (cW - dW) / 2;
                const cy = (cH - dH) / 2;

                // Offset: đưa frame (col,row) về vị trí căn giữa
                const bgX = Math.round(cx - col * dW);
                const bgY = Math.round(cy - row * dH);

                el.style.backgroundSize = bgW + 'px ' + bgH + 'px';
                el.style.backgroundPosition = bgX + 'px ' + bgY + 'px';
            };

            return {
                render(timeMs) {
                    if (!level.intervalMs) return;
                    const frameIdx = Math.min(Math.round(timeMs / level.intervalMs), level.totalCount - 1);
                    const sheetIdx = Math.floor(frameIdx / perSheet);
                    const inSheet = frameIdx % perSheet;
                    const col = inSheet % level.cols;
                    const row = Math.floor(inSheet / level.cols);
                    pCol = col; pRow = row; pSheet = sheetIdx;

                    let entry = sheetCache.get(sheetIdx);
                    if (!entry) {
                        const url = sbSheetUrl(sb, level, sheetIdx);
                        const im = new Image();
                        entry = { img: im, url: url, loaded: false, natW: 0, natH: 0 };
                        im.addEventListener('load', () => {
                            if (!alive) return;
                            entry.loaded = true;
                            entry.natW = im.naturalWidth;
                            entry.natH = im.naturalHeight;
                            // Nếu đang hiển thị sheet này, re-apply
                            if (pSheet === sheetIdx && appliedSheet !== sheetIdx) {
                                appliedSheet = sheetIdx;
                                if (currentUrl !== url) {
                                    currentUrl = url;
                                    el.style.backgroundImage = 'url(' + url + ')';
                                }
                                applyAt(pCol, pRow, entry.natW, entry.natH);
                            }
                        }, { once: true });
                        im.src = url;
                        sheetCache.set(sheetIdx, entry);
                    }

                    if (entry.loaded) {
                        appliedSheet = sheetIdx;
                        if (currentUrl !== entry.url) {
                            currentUrl = entry.url;
                            el.style.backgroundImage = 'url(' + entry.url + ')';
                        }
                        applyAt(col, row, entry.natW, entry.natH);
                    }
                },
                destroy() {
                    alive = false;
                    sheetCache.forEach(e => { e.img.src = ''; });
                    sheetCache.clear();
                    el.style.backgroundImage = 'none';
                    currentUrl = '';
                }
            };
        }
        /* ================================================================ */

        function resetBubbleImg() {
            bimg.style.backgroundImage = 'none';
            bimg.style.backgroundSize = '';
            bimg.style.backgroundPosition = '';
        }

        function bubbleDuration() {
            const d = bvid.duration;
            if (d && isFinite(d) && d > 0) return d;
            return duration;
        }

        function hideStill() {
            liveArmed = false;
            clearTimeout(seekTimer);
            if (pendingSeeked) { bvid.removeEventListener('seeked', pendingSeeked); pendingSeeked = null; }
            if (metaListener) { bvid.removeEventListener('loadedmetadata', metaListener); metaListener = null; }
            if (liveMode) { liveMode = false; bubble.classList.remove('pv-live'); }
        }

        function issueSeek() {
            seekTimer = 0;
            const d = bubbleDuration();
            if (!d || !isFinite(d)) return;
            if (liveArmed || liveMode) return;
            if (lastFrac < 0) return;
            liveArmed = true;
            const target = lastFrac;
            const doSeek = () => {
                if (!liveArmed) return;
                if (pendingSeeked) bvid.removeEventListener('seeked', pendingSeeked);
                pendingSeeked = () => {
                    bvid.removeEventListener('seeked', pendingSeeked); pendingSeeked = null;
                    if (!liveArmed) return;
                    liveArmed = false; liveMode = true;
                    bubble.classList.add('pv-live');
                };
                bvid.addEventListener('seeked', pendingSeeked);
                try { bvid.currentTime = target * d; } catch (e) { hideStill(); }
            };
            if (bvid.readyState >= 1) doSeek();
            else {
                if (metaListener) bvid.removeEventListener('loadedmetadata', metaListener);
                metaListener = () => {
                    bvid.removeEventListener('loadedmetadata', metaListener); metaListener = null;
                    if (bvid.videoWidth && bvid.videoHeight) setBubbleAspect(bvid.videoWidth, bvid.videoHeight);
                    doSeek();
                };
                bvid.addEventListener('loadedmetadata', metaListener);
            }
        }
        function armSeek() { clearTimeout(seekTimer); seekTimer = setTimeout(issueSeek, STILL_DEBOUNCE); }

        let hideT = 0;
        bar.addEventListener('mouseenter', () => { clearTimeout(hideT); bar.classList.add('pv-show'); });
        bar.addEventListener('mouseleave', () => { hideT = setTimeout(() => bar.classList.remove('pv-show'), 900); hideBubble(); });

        let dragging = false, raf = 0, nextFrac = null, moveRaf = 0, lastMoveEvent = null;
        function processMove() {
            moveRaf = 0;
            if (!lastMoveEvent) return;
            const e = lastMoveEvent; lastMoveEvent = null;
            const f = fracFrom(e);
            moveBubble(e, f);
            if (dragging) queueSeekPlayer(f);
        }
        function fracFrom(e) { const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
        function seekPlayer(f) {
            const d = bubbleDuration();
            if (fallbackMode) { if (d > 0) { try { stageVid.currentTime = f * d; } catch (e) {} } return; }
            if (apiReady && d > 0) { try { player.seekTo(f * d, true); } catch (e) {} }
        }
        function queueSeekPlayer(f) {
            nextFrac = f;
            if (raf) return;
            raf = requestAnimationFrame(() => { raf = 0; if (nextFrac !== null) seekPlayer(nextFrac); });
        }

        function moveBubble(e, f) {
            lastFrac = f;
            hideStill();
            bubble.style.opacity = '1';
            const bw = bubble.offsetWidth || 240;
            const x = Math.min(window.innerWidth - bw - 4, Math.max(4, e.clientX - bw / 2));
            bubble.style.left = x + 'px';
            const d = bubbleDuration();
            btime.textContent = fmt(f * (d || 0));

            if (streamUrl && !videoSrcAttached) {
                videoSrcAttached = true;
                bvid.src = streamUrl;
                bvid.muted = true;
                const onPreloadMeta = () => {
                    bvid.removeEventListener('loadedmetadata', onPreloadMeta);
                    if (bvid.videoWidth && bvid.videoHeight) setBubbleAspect(bvid.videoWidth, bvid.videoHeight);
                    if (lastFrac >= 0 && bvid.duration && isFinite(bvid.duration)) {
                        try {
                            bvid.currentTime = lastFrac * bvid.duration;
                            const p = bvid.play();
                            if (p && typeof p.then === 'function') p.then(() => { setTimeout(() => { try { bvid.pause(); } catch (x) {} }, 100); }).catch(() => {});
                        } catch (x) {}
                    } else {
                        const p = bvid.play();
                        if (p && typeof p.then === 'function') p.then(() => { setTimeout(() => { try { bvid.pause(); } catch (x) {} }, 100); }).catch(() => {});
                    }
                };
                bvid.addEventListener('loadedmetadata', onPreloadMeta);
            }

            if (!sbRenderer && sbParsed) sbRenderer = makeBubbleRenderer(bimg, sbParsed);
            if (sbRenderer && d && isFinite(d)) sbRenderer.render(f * d * 1000);
            armSeek();
        }

        function hideBubble() { bubble.style.opacity = '0'; lastFrac = -1; hideStill(); }

        track.addEventListener('pointermove', (e) => { lastMoveEvent = e; if (!moveRaf) moveRaf = requestAnimationFrame(processMove); });
        track.addEventListener('pointerleave', () => { if (!dragging) hideBubble(); });
        track.addEventListener('pointerdown', (e) => {
            e.preventDefault(); dragging = true; hideStill();
            try { track.setPointerCapture(e.pointerId); } catch (x) {}
            const f = fracFrom(e);
            seekPlayer(f); moveBubble(e, f);
        });
        track.addEventListener('pointerup', () => { dragging = false; bubble.style.opacity = '0'; hideStill(); });
        bvid.addEventListener('error', () => { bvid.removeAttribute('src'); });

        window.addEventListener('message', function (event) {
            if (event.origin !== PARENT_ORIGIN) return;
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'load' && data.videoId) {
                streamUrl = null; videoSrcAttached = false; sbParsed = null;
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleImg(); resetFallback();
                bvid.removeAttribute('src'); try { bvid.load(); } catch (e) {}
                hideBubble(); setBubbleAspect(16, 9);
                loadVideo(data.videoId);
            }
            if (data.type === 'stream' && data.url) {
                streamUrl = data.url; videoSrcAttached = false;
                sbParsed = parseStoryboardSpec(data.sb);
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleImg();
                if (fallbackPending) activateFallback();
            }
            if (data.type === 'stop') {
                stopVideo(); streamUrl = null; videoSrcAttached = false; sbParsed = null;
                if (sbRenderer) { sbRenderer.destroy(); sbRenderer = null; }
                resetBubbleImg();
                bvid.removeAttribute('src'); try { bvid.load(); } catch (e) {}
                hideBubble(); bar.classList.remove('pv-show'); setBubbleAspect(16, 9);
            }
            if (data.type === 'cache-get' && data.id) {
                const e = lsLoad()[data.id];
                if (e && e.url) window.parent.postMessage({ type: 'cache-hit', id: data.id, url: e.url, ts: e.ts || 0, sb: e.sb || null }, PARENT_ORIGIN);
                else window.parent.postMessage({ type: 'cache-miss', id: data.id }, PARENT_ORIGIN);
            }
            if (data.type === 'cache-set' && data.id && data.url) {
                const o = lsLoad();
                o[data.id] = { url: data.url, ts: data.ts || Date.now(), sb: data.sb || null };
                lsPersist();
            }
        });

        window.addEventListener('beforeunload', () => { if (player) player.stopVideo(); });
    </script>
</body>
</html>
